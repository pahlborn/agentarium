<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Agentarium</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Resonanz">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05070C">
<style>
  :root{ --grund:#05070C; }
  html,body{margin:0;padding:0;width:100%;height:100%;background:var(--grund);}
  html{overflow:hidden;overscroll-behavior:none;touch-action:none;}
  body{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;touch-action:none;}
  canvas{
    position:fixed; inset:0; width:100%; height:100%; display:block;
    background:var(--grund); touch-action:none;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  }
  #hinweis{
    position:fixed; left:0; right:0; bottom:max(22px, env(safe-area-inset-bottom));
    text-align:center; pointer-events:none;
    font:400 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing:.22em; text-transform:uppercase; color:#4B5A72;
    transition:opacity 1.2s ease;
  }
  #kopf{
    position:fixed; left:0; right:0; top:max(14px, env(safe-area-inset-top));
    text-align:center; pointer-events:none; z-index:3;
    font:400 13px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing:.26em; text-transform:uppercase; color:#7B8AA6;
  }
  #kopf b{display:block; font-weight:400; font-size:17px; color:#C9D4E6; letter-spacing:.20em;}
  #kopf i{display:block; font-style:normal; font-size:11px; color:#4B5A72; letter-spacing:.16em;
          text-transform:none; margin-top:5px;}
  #tuer{
    position:fixed; right:max(12px, env(safe-area-inset-right));
    bottom:max(12px, env(safe-area-inset-bottom));
    z-index:6; pointer-events:auto; -webkit-tap-highlight-color:transparent;
    width:46px; height:46px; border-radius:23px; border:1px solid rgba(160,180,210,.16);
    background:rgba(10,14,22,.30); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center;
    color:rgba(180,198,224,.42); font:400 17px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    transition:opacity .6s ease, background .2s ease; opacity:.55;
  }
  #tuer:active{background:rgba(20,28,42,.55);}
  #leiste{
    position:fixed; right:max(12px, env(safe-area-inset-right));
    bottom:calc(max(12px, env(safe-area-inset-bottom)) + 56px);
    z-index:6; display:none; flex-direction:column; gap:1px;
    background:rgba(150,170,200,.12); border:1px solid rgba(150,170,200,.12);
    border-radius:10px; overflow:hidden; min-width:172px;
  }
  #leiste.auf{display:flex;}
  #leiste a, #leiste button{
    appearance:none; border:0; text-align:left; cursor:pointer;
    display:block; padding:13px 17px; background:rgba(9,13,20,.86);
    color:#C2CEE2; text-decoration:none;
    font:400 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.14em;
    text-transform:uppercase; -webkit-tap-highlight-color:transparent;
  }
  #leiste a:active, #leiste button:active{background:rgba(22,30,45,.95);}
  #ruf{
    position:fixed; left:0; right:0; bottom:calc(max(12px, env(safe-area-inset-bottom)) + 72px);
    z-index:7; text-align:center; pointer-events:none; opacity:0;
    transition:opacity .5s ease; color:#9FB0CC;
    font:400 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.2em;
    text-transform:uppercase;
  }
  #ruf.da{opacity:1;}
  #agRing{position:fixed; inset:0; pointer-events:none; z-index:3;}
  /* Der Steckbrief eines Agenten: beim Daraufzeigen, beim Antippen. */
  #agSteck{position:fixed; z-index:9; width:270px; padding:15px 17px;
    border-radius:10px; background:rgba(8,12,19,.96);
    border:1px solid rgba(150,170,200,.18);
    font:400 12px/1.5 -apple-system,system-ui,sans-serif; color:#AEBCD2;
    opacity:0; pointer-events:none; transition:opacity .25s ease;}
  #agSteck.auf{opacity:1;}
  #agSteck b{font-weight:500; font-size:13px; letter-spacing:.14em;
    text-transform:uppercase;}
  #agSteck i{display:block; font-style:normal; color:#8295B0; font-size:11px;
    letter-spacing:.2em; text-transform:uppercase; margin-top:2px;}
  #agSteck code{display:block; margin-top:7px; color:#6B7689; font-size:10.5px;
    letter-spacing:.08em; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  #agSteck p{margin:11px 0 12px; color:#C8D4E6;}
  #agSteck dl{margin:0; display:grid; grid-template-columns:auto 1fr;
    gap:3px 12px; font-size:11px;}
  #agSteck dt{color:#6B7689; letter-spacing:.14em; text-transform:uppercase;
    font-size:9.5px; padding-top:2px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  #agSteck dd{margin:0; color:#AEBCD2;}
  #agSteck .nein{color:#A8707A;}
  #agSteck .schaetz{color:#9A8A62;}
  /* Was ein Auftrag verbraucht hat — erscheint beim Erledigen, verebbt. */
  #agKostenEbene{position:fixed; inset:0; z-index:5; pointer-events:none;}
  .agKosten{position:absolute; transform:translate(-50%,-100%);
    font:400 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.12em; white-space:nowrap;
    animation:agKostenEin 16s ease forwards;}
  /* Geschätztes kursiv und in Klammern: Es muss sich als geschätzt zu
     erkennen geben, auch ohne dass jemand den Steckbrief öffnet. */
  .agKosten.geschaetzt{font-style:italic; opacity:.8;}
  .agKosten.geschaetzt::before{content:'~';opacity:.6;padding-right:3px;}
  /* Sechzehn Sekunden statt sechs, und der Aufstieg ist flacher. Vorher
     war die Zahl weg, bevor man sie gelesen hatte — und sie wanderte dabei
     so weit nach oben, dass sie sich schon im Verschwinden befand, während
     man noch hinsah. Jetzt steht sie fast die ganze Zeit still. */
  @keyframes agKostenEin{0%{opacity:0;transform:translate(-50%,-80%);}
    5%{opacity:1;transform:translate(-50%,-100%);}
    84%{opacity:1;transform:translate(-50%,-108%);}
    100%{opacity:0;transform:translate(-50%,-122%);}}
  /* Die Namen atmen durchgehend — ein Team, das wartet, ist nicht tot.
     Der Wechsel Name <-> Rolle fällt in das Tal dieses Atems, deshalb
     sieht man kein Umspringen, sondern nur, dass beim Hellwerden etwas
     anderes dasteht. */
  .agName{position:absolute; transform:translate(-50%,-50%);
    font:400 14px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing:.2em; text-transform:uppercase;
    white-space:nowrap; opacity:.7;
    animation:agAtem 4s ease-in-out infinite;}
  /* Das Atmen darf nicht zum Verstecken werden. Vorher ging es von 0,30 bis
     0,66 — im Tal war der Name praktisch weg, und zusammen mit 11 px war er
     nicht mehr zu lesen. Jetzt 0,52 bis 0,88: Man sieht den Atem immer
     noch, aber man muss ihn nicht abwarten, um den Namen zu erkennen. */
  @keyframes agAtem{0%,100%{opacity:.52;} 50%{opacity:.88;}}
  /* Wer arbeitet, leuchtet — damit man es auch am Rand des Blicks bemerkt. */
  /* Wer arbeitet, atmet tiefer und schneller. */
  .agName.arbeitet{animation:agPuls 2.4s ease-in-out infinite;}
  /* Wer gleich fängt, schwillt an — und zwar ohne Übergangszeit: Eine
     Erwartung, die sanft einblendet, kommt zu spät. Das Zurückgehen
     danach darf weich sein. */
  .agName.faengt{opacity:1 !important; animation:none;
    transition:transform .12s ease-out;}
  .agName{transition:transform .5s ease;}
  @keyframes agPuls{0%,100%{opacity:.80;} 50%{opacity:1;}}
  /* Erstes Pult: Wer vorgezogen sitzt, steht auch etwas deutlicher da. */
  /* Wer außerhalb des Kreises steht, steht auch anders da: etwas größer
     und weiter gesperrt. Kein Abzeichen — nur ein anderer Ton. */
  .agDraussen{font-size:15.5px; letter-spacing:.34em;}
  /* Der Umschlag Name <-> Rolle: Die Schrift läuft auseinander und wieder
     zusammen, als würde das Wort im Feld neu gegossen — kein Ausblenden. */
  @keyframes agGuss{
    0%{letter-spacing:.85em; opacity:0; filter:blur(3px);}
    45%{letter-spacing:.2em; opacity:1; filter:blur(0);}
    100%{letter-spacing:.2em;}}
  /* Beim Umschlag läuft die Schrift kurz auseinander und wieder zusammen —
     dann übernimmt wieder der Atem. */
  .agGuss{animation:agGuss 1.3s cubic-bezier(.2,.7,.3,1) both,
                    agAtem 4s ease-in-out infinite;}

  /* Oben links EINE Liste. Sie wechselt zwischen dem, was zu tun ist, und
     dem, was geschehen ist — zwei Listen nebeneinander waren zu viel.
     Die Überschrift sagt, welche gerade steht; ohne sie müsste man raten. */
  /* Die Liste steht UNTEN und wächst nach oben: Der neueste Eintrag liegt
     immer direkt über der Beschriftung, ältere rücken hinauf und laufen
     oben aus dem Bild. Vorher hing sie oben und wurde unten abgeschnitten
     — da verschwand das NEUESTE, und das ist genau falsch herum.
     Die Maske oben lässt sie ins Nichts auslaufen statt an einer Kante
     abzureißen. */
  /* Die Liste hängt unter dem Kopf und wächst nach UNTEN, höchstens vier
     Einträge weit. Vorher lief sie von unten nach oben über den ganzen
     Schirm und verschwand oben im Nichts — eindrucksvoll, aber sie nahm
     dem Geschehen den Platz und war beim Vorbeisehen nicht zu fassen.
     Vier Einträge sind das, was man im Vorbeigehen liest. */
  /* Unten links, der neueste Eintrag ganz unten — dort sucht das Auge
     das Neueste. Höchstens vier; der älteste rückt oben hinaus und läuft
     in der Maske aus, statt an einer Kante abzureißen. */
  #agEcke{position:fixed; left:max(14px,env(safe-area-inset-left));
    bottom:calc(max(14px,env(safe-area-inset-bottom)) + 10px);
    z-index:4; pointer-events:none; width:min(42vw,330px);
    display:flex; flex-direction:column; justify-content:flex-end;
    overflow:hidden; transition:opacity .45s ease;
    -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 46px);
    mask-image:linear-gradient(to bottom, transparent 0, #000 46px);}
  #agEcke.leise{opacity:0;}
  /* Im Ausklang verblasst die Liste von selbst — langsamer als beim
     Wegschalten, denn hier geht nichts aus, hier klingt etwas ab. */
  #agEcke.ausklang{opacity:0; transition:opacity 4.5s ease;}
  /* Im Hochformat ist die Liste schmaler, sonst bliebe für das Feld
     kein Band übrig. Dieselbe Zahl steht in der Schicht (`listeBreite`);
     gehen die beiden auseinander, rechnet das Feld mit einem Platz, den es
     nicht hat. */
  @media (orientation:portrait){
    #agEcke{width:min(34vw,240px);}
  }
  #agLaeuft{flex:0 0 auto;}
  /* Die Beschriftung „Was geschieht" ist jetzt ein Knopf unten rechts,
     bei den anderen. Hier bleibt nichts stehen. */
  #agTitel{display:none;}
  #agLaeuft{font:400 12px/1.45 -apple-system,system-ui,sans-serif;}
  .agAuf{margin-bottom:11px; transition:opacity .8s ease;}
  /* Ein offener Auftrag steht hell. Was geschehen ist, steht blass — die
     Liste sagt damit zweierlei zugleich, wofür es vorher zwei brauchte. */
  .agAuf.offen{opacity:1;}
  .agAuf.tat{opacity:.42;}
  .agAuf.tat s{text-decoration:none; font-size:9px; letter-spacing:.16em;
    text-transform:uppercase;}
  .agAuf u{text-decoration:none;
    font:400 10px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.22em;}
  .agAuf b{font-weight:500; font-size:11px; letter-spacing:.1em;
    text-transform:uppercase; opacity:.75;}
  .agAuf span{color:#C2CEE2;}
  .agAuf em{font-style:normal; color:#8295B0; font-size:9px;
    letter-spacing:.16em; text-transform:uppercase;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  /* Der Verlauf steht nicht mehr in einer Spalte, sondern dort, wo er
     geschieht — am Empfänger, nach außen geschrieben, und er vergeht. */
  #agRufe{position:fixed; inset:0; z-index:4; pointer-events:none;}
  /* Die Beschriftung des Werks: leuchtet bei der Abnahme auf, verebbt
     wieder. Mittig gesetzt, denn dort wächst es. */
  #agWerk{position:fixed; inset:0; z-index:5; pointer-events:none;}
  /* DAS PRODUKT: SCHRIFT UND EIN WAAGERECHTER BALKEN.

     Es sitzt unten in der Mitte des freien Bandes, nicht im Feld. Damit
     kann es nichts überlagern und von nichts überlagert werden — und es
     besteht aus Schrift statt aus Fäden, also kann dort auch kein
     Fadenwerk stehenbleiben. */
  /* Das Produkt steht rechts oben — dort, wo sonst der Kopf stand. Es
     ist das Ziel der ganzen Übung, also bekommt es die Ecke, die das Auge
     nach dem Titel als zweites ansteuert. */
  /* Unter dem Kopf, mit einer Trennlinie dazwischen: Es gehört zusammen
     (das ist das Projekt, das ist sein Stand), aber es ist nicht dasselbe. */
  #agWerkName{position:fixed; z-index:6; pointer-events:none;
    right:max(14px,env(safe-area-inset-right));
    top:calc(max(14px,env(safe-area-inset-top)) + 104px);
    opacity:0; transition:opacity 1.2s ease;
    width:min(32vw,320px); text-align:right; color:#AEBCD2;
    padding-top:12px; border-top:1px solid rgba(150,170,200,.14);}
  #agWerkName.auf{opacity:.72;}
  #agWerkName.hell{opacity:1;}
  .wBalken{height:3px; border-radius:2px; overflow:hidden;
    background:rgba(150,170,200,.17); margin-bottom:9px;}
  .wBalken span{display:block; height:100%; background:#8FA3C0;
    transition:width 1.4s ease, background 2s ease;}
  #agWerkName.hell .wBalken span{background:#E8D9A8;
    box-shadow:0 0 10px rgba(232,217,168,.75);}
  .wTitel{font:400 10px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.22em; text-transform:uppercase;
    overflow-wrap:anywhere;}
  .wOrt{margin-top:4px; font:400 8.5px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.24em; text-transform:uppercase; opacity:.6;}
  /* Die Beschriftung einer Abnahme. Diese drei Zeilen hatte einer meiner
     Schnitte beim Umbau mitgenommen — danach hatte das Element gar keine
     Positionierung mehr und klebte in der linken oberen Ecke, über dem
     Titel. Inline gesetzte `left`/`top` nützen nichts ohne `position`. */
  .agWerk{position:absolute; transform:translate(-50%,0); width:270px;
    text-align:center; animation:agWerkEin 8.6s ease forwards;}
  .agWerk span{display:block; color:#DCE5F3;
    font:400 13px/1.4 -apple-system,system-ui,sans-serif;
    text-shadow:0 0 16px rgba(0,0,0,.9), 0 0 5px rgba(0,0,0,.9);}
  .agWerk u{display:block; text-decoration:none; font-size:9px;
    letter-spacing:.3em; text-transform:uppercase; opacity:.7;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; margin-bottom:3px;}
  @keyframes agWerkEin{
    0%{opacity:0; transform:translate(-50%,8px); filter:blur(4px);}
    9%{opacity:1; transform:translate(-50%,0); filter:blur(0);}
    55%{opacity:1;} 100%{opacity:0;}}
  .agRuf{position:absolute; width:210px;
    font:400 11.5px/1.35 -apple-system,system-ui,sans-serif; color:#9FAFC6;
    animation:agEin 7.2s ease forwards;}
  .agRuf u{text-decoration:none; font-weight:500;}
  .agRuf s{text-decoration:none; font-size:9px; letter-spacing:.16em;
    text-transform:uppercase;}
  .agRuf span{color:#AEBCD2;}
  @keyframes agEin{0%{opacity:0;transform:translateY(5px);}
    7%{opacity:1;transform:none;} 62%{opacity:1;} 100%{opacity:0;}}
  /* Der Kopf steht links oben: Name, Projekt, Uhr. Klassisch, und genau
     deshalb lesbar — man sucht einen Titel oben links. */
  /* Kopf und Produkt stehen übereinander rechts oben: wer das hier ist,
     und was dabei herauskommt. Links unten läuft mit, was geschieht. */
  #agKopf{position:fixed; right:max(14px,env(safe-area-inset-right));
    top:max(14px,env(safe-area-inset-top)); z-index:7; text-align:right;
    width:min(32vw,320px);
    font:400 11px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.2em; text-transform:uppercase; color:#55637A;}
  /* Das Leitmotiv, wie es in AG-MOCK-COMPARE-001 steht. Klein, einmal, und
     es bleibt stehen — es ist der Name der Sache, keine Beschriftung. */
  #agKopf em{display:block; font-style:normal; font-size:8.5px;
    letter-spacing:.14em; text-transform:none; color:#4B5A72;
    margin:1px 0 6px;}
  /* Diese Regel muss NACH der Breitenangabe des Kopfes stehen. Beim ersten
     Versuch stand sie weiter oben bei der Liste — gleiche Gewichtung, also
     gewann die spätere Zeile, und der Kopf blieb im Hochformat 330 breit.
     Nachgemessen: rechter Rand bei 344 statt 254. */
  @media (orientation:portrait){
    #agKopf{width:min(40vw,260px);}
  }
  #agKopf b{display:block; color:#AFC0D8; font-weight:400; font-size:13px;
    letter-spacing:.16em;}
  #agUhr{color:#8295B0;}
  /* Welches Projekt gerade läuft — aus den Daten, nicht aus dem Code. */
  #agProjekt{display:block; font-style:normal; color:#8295B0; font-size:10px;
    letter-spacing:.22em; margin-bottom:2px;}
  #agProjekt.fragbar{pointer-events:auto; cursor:pointer;
    border-bottom:1px dotted rgba(150,170,200,.35); padding-bottom:1px;}
  /* Die Kurzbeschreibung auf Antippen — auf einem iPad gibt es kein
     Darüberfahren, also kein Tooltip, sondern ein Blatt. */
  #agWas{position:fixed; right:max(14px,env(safe-area-inset-right));
    top:calc(max(14px,env(safe-area-inset-top)) + 92px); z-index:9;
    width:min(70vw,330px); padding:15px 17px; border-radius:10px;
    background:rgba(8,12,19,.95); border:1px solid rgba(150,170,200,.16);
    color:#C2CEE2; font:400 12.5px/1.5 -apple-system,system-ui,sans-serif;
    text-transform:none; letter-spacing:0; text-align:left;
    opacity:0; transform:translateY(-6px); pointer-events:none;
    transition:opacity .35s ease, transform .35s ease;}
  #agWas.auf{opacity:1; transform:none; pointer-events:auto;}
  /* Die Projektwahl sitzt im selben Blatt wie die Beschreibung: Was läuft
     und was es ist, gehören zusammen. */
  .wProjekte{list-style:none; margin:0 0 12px; padding:0 0 11px;
    border-bottom:1px solid rgba(150,170,200,.16);}
  .wProjekte li{cursor:pointer; padding:5px 0; color:#8EA0BA;
    font:400 11px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.18em; text-transform:uppercase;}
  .wProjekte li:hover{color:#D6E0F0;}
  .wProjekte li.hier{color:#E8D9A8;}
  .wProjekte li.hier::before{content:'— '; opacity:.7;}
  #agWas .wTitel{margin:0 0 7px; color:#D6E0F0; font-size:13px;}
  #agWas p{margin:0;}
  /* Der Stand der Arbeit, unten rechts über den Knöpfen. Keine Grafik,
     sondern Striche: Jeder Strich ist ein Stück Arbeit, und man kann sie
     zählen. Eine Kurve würde glätten, was gerade nicht glatt ist. */
  #agStand{position:fixed; right:max(14px,env(safe-area-inset-right));
    bottom:calc(max(14px,env(safe-area-inset-bottom)) + 54px);
    z-index:4; pointer-events:none; text-align:right;}
  .sZeile{display:flex; align-items:center; justify-content:flex-end;
    gap:7px; margin-bottom:5px;}
  .sZeile u{text-decoration:none; color:#55637A; order:1;
    font:400 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.2em; text-transform:uppercase; min-width:62px;
    text-align:right;}
  .sZeile b{color:#9FAFC6; order:2; font-weight:400; min-width:16px;
    font:400 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;}
  .sZeile i{display:flex; gap:2px; order:0;}
  .sZeile s{display:block; width:3px; height:11px; text-decoration:none;}
  .sOffen{background:#8FA3C0;}
  .sTisch{background:#C8D4E6;}
  .sStop{background:#A8707A;}
  .sFertig{background:#E8D9A8;}
  /* ZUM SCHLUSS LEUCHTET DAS FERTIGE.

     Peters zwei Anweisungen treffen sich hier: „Das Produkt muss leuchtend
     erstrahlen" und „belassen wir es bei dem nüchternen, anwachsenden
     Balken." Also leuchtet der Balken — die Zeile, die ohnehin zählt, was
     fertig ist. Kein zweites Gebilde im Feld.

     Drei Sekunden Übergang, damit es aufgeht und nicht angeht. */
  #agStand .sZeile, #agStand .sZeile s, #agStand .sZeile u, #agStand .sZeile b{
    transition:color 3s ease, background 3s ease, box-shadow 3s ease,
               opacity 3s ease, transform 3s ease;}
  #agStand.fertig .sZeile{opacity:.3;}
  #agStand.fertig .sZeile:last-of-type{opacity:1;}
  #agStand.fertig .sFertig{background:#FFF3CF; box-shadow:0 0 9px #E8D9A8;
    transform:scaleY(1.5);}
  #agStand.fertig .sZeile:last-of-type u{color:#E8D9A8;}
  #agStand.fertig .sZeile:last-of-type b{color:#FFF3CF;}
  #agStand.fertig .sUmfang{color:#AEBCD2;}
  .sUmfang{margin-top:7px; color:#55637A;
    font:400 9px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.14em;}
  #agTasten{position:fixed; right:max(14px,env(safe-area-inset-right));
    bottom:max(14px,env(safe-area-inset-bottom)); z-index:11; display:flex; gap:1px;
    border-radius:8px; overflow:hidden; background:rgba(150,170,200,.12);}
  #agTasten button{appearance:none;border:0;cursor:pointer;padding:12px 16px;
    background:rgba(9,13,20,.82); color:#B8C6DC; pointer-events:auto;
    font:400 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.16em; text-transform:uppercase;
    -webkit-tap-highlight-color:transparent;}
  #agTasten button:active{background:rgba(22,30,45,.95);}
  /* Die Knöpfe gehen weg, wenn man sie nicht braucht — das Feld ist die
     Hauptsache, nicht die Bedienung. Sie kommen bei der kleinsten Bewegung
     zurück und bleiben, solange eine Tafel offen ist.
     Unsichtbar heißt auch unanklickbar: Ein blinder Treffer auf einen
     Knopf, den man nicht sieht, wäre schlimmer als ein zweites Antippen. */
  #agTasten{transition:opacity .55s ease;}
  #agTasten.leise{opacity:0; pointer-events:none;}
  /* Angeschaltet heißt heller, nicht bunter. Vorher stand hier ein
     gesättigtes Blau — der einzige Farbblock in einem Bild aus gedeckten
     Tönen, und entsprechend fremd. Jetzt derselbe Grund, nur eine Stufe
     aufgehellt, und die Kante trägt die Auskunft. */
  #agTasten button.an{background:rgba(20,27,39,.92); color:#E6EEFB;
    box-shadow:inset 0 1px 0 rgba(184,198,220,.34);}
  /* Welches Modell an welcher Aufgabe sitzt — einblendbar, nicht ständig. */
  /* WER GERADE ARBEITET — und zwar an seinem Platz, nicht in einer Liste.
     Peters Frage: „Manchmal wartet man auf Aktion und es kommt nichts,
     weil wahrscheinlich ein Agent arbeitet und alle warten auf die
     Beendigung dieser." Genau das muss dastehen, sonst liest sich die
     Pause als Stillstand. */
  #agTun{position:fixed; inset:0; z-index:6; pointer-events:none;}
  /* Das Schild eines Stops. Es sitzt ÜBER dem Namen, während die
     Arbeitsanzeige darunter sitzt — beides zugleich kommt vor (ein Agent
     kann an einem Auftrag arbeiten und an einem anderen hängen). */
  #agStoppSchilder{position:fixed; inset:0; z-index:7; pointer-events:none;}
  .agStoppS{position:absolute; transform:translate(-50%,-100%);
    pointer-events:auto; cursor:pointer; text-align:center; white-space:nowrap;
    font:400 9px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.2em; text-transform:uppercase;
    -webkit-tap-highlight-color:transparent;}
  .agStoppS::after{content:''; display:block; width:1px; height:9px;
    margin:3px auto 0; background:currentColor; opacity:.5;}
  .agStoppS b{display:block; font-weight:400; opacity:.65;
    letter-spacing:.14em; text-transform:none;}
  /* Der Grund, auf Zeigen oder Antippen. */
  #agStopp{position:fixed; z-index:10; width:290px; padding:14px 16px;
    border-radius:10px; background:rgba(8,12,19,.97);
    border:1px solid rgba(150,170,200,.18);
    font:400 12px/1.5 -apple-system,system-ui,sans-serif; color:#C8D4E6;
    opacity:0; pointer-events:none; transition:opacity .2s ease;}
  #agStopp.auf{opacity:1;}
  #agStopp b{font-weight:500; font-size:11px; letter-spacing:.2em;
    text-transform:uppercase;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  #agStopp i{display:block; font-style:normal; color:#8295B0; font-size:10px;
    letter-spacing:.16em; text-transform:uppercase; margin-top:3px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  #agStopp p{margin:10px 0 9px;}
  #agStopp small{display:block; color:#8295B0; font-size:11px; line-height:1.45;
    padding-top:9px; border-top:1px solid rgba(150,170,200,.14);}
  .agTut{position:absolute; transform:translate(-50%,0); white-space:nowrap;
    font:400 9px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.2em; text-transform:uppercase; text-align:center;
    opacity:0; transition:opacity .8s ease;}
  .agTut.auf{opacity:.92;}
  .agTut b{font-weight:400; display:block; opacity:.62; letter-spacing:.14em;}
  /* Je länger alle warten, desto deutlicher. Die Pause selbst ist die
     Auskunft — nicht ein Zustand, den man wegdesignen müsste. */
  .agTut.lang{opacity:1;}
  .agTut.lang b{opacity:.95;}
  #agMotoren{position:fixed; inset:0; z-index:4; pointer-events:none;}
  .agMot{position:absolute; transform:translate(-50%,0); opacity:.5;
    font:400 10.5px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.16em; text-transform:uppercase; white-space:nowrap;}
  .agMot.tut{opacity:.95;}
  .agMot em{display:block; margin-top:3px; font-style:normal; font-size:9px;
    letter-spacing:.1em; text-transform:none; opacity:.8;}
  /* Eine Lücke sieht anders aus als eine Zahl — sonst liest man sie als
     Null. Gepunktet unterstrichen heißt „fehlt", nicht „ist null". */
  .agMot em.luecke{opacity:.95; color:#C9A227;
    text-decoration:underline dotted; text-underline-offset:3px;}
  .agMot em.leer{opacity:.42; font-style:italic;}
  .agKosten.nurZeit{opacity:.75;}
  /* Der Status der Kostenbasis. Er steht unten in der Mitte des Bandes,
     gut sichtbar, und er geht nicht weg — eine fehlende Anzeige liest man
     als Fehler, eine beschriftete als Auskunft. */
  .agBasis{position:absolute; left:50%; transform:translate(-50%,0);
    bottom:max(14px,env(safe-area-inset-bottom));
    font:400 9.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.18em; text-transform:uppercase; white-space:nowrap;
    color:#6B7689;}
  .agBasis.luecke{color:#C9A227;
    text-decoration:underline dotted; text-underline-offset:4px;}
  .agMot em s{display:block; text-decoration:none; opacity:.75;
    color:#C9A227; font-size:8.5px;}
  .agAuf i.agMotor{font-style:normal; color:#6B7689; font-size:9px;
    letter-spacing:.16em; text-transform:uppercase;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}

  /* Die Legende: das Gesetz zum Nachlesen. Sie liegt über dem Feld und
     geht wieder weg — sie ist kein Teil des Bildes. */
  #agGesetz{position:fixed; inset:0; z-index:9; display:none;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    background:rgba(6,9,14,.93); color:#AFC0D8;
    padding:calc(max(18px,env(safe-area-inset-top)) + 8px)
            max(18px,env(safe-area-inset-right)) 96px
            max(18px,env(safe-area-inset-left));
    font:400 13px/1.5 -apple-system,system-ui,sans-serif;}
  #agGesetz.auf{display:block;}
  #agGesetz .gSatz{margin:0 0 26px; color:#D6E0F0; font-size:15px; line-height:1.6;
    max-width:40em;}
  #agGesetz .gSatz b{font-weight:500;}
  #agGesetz h4{margin:26px 0 8px; font-weight:400; font-size:11px;
    letter-spacing:.2em; text-transform:uppercase;}
  #agGesetz table{border-collapse:collapse; width:100%; max-width:46em;}
  #agGesetz td{padding:6px 12px 6px 0; vertical-align:top;
    border-top:1px solid rgba(150,170,200,.11);}
  #agGesetz .gArt{color:#7F8FA8; white-space:nowrap;
    font:400 11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;}
  #agGesetz .gWas{color:#C2CEE2;}
  #agGesetz .gRes{color:#7F8FA8; font-size:12px;}
  #agGesetz .gDau{color:#6B7689; font-size:11px; white-space:nowrap;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  #agGesetz .gFuss{margin:30px 0 0; color:#7F8FA8; max-width:40em;}
  .z-bleibt{color:#E8D9A8;} .z-verblasst{color:#8FA3C0;} .z-nichts{color:#6B7689;}
  .agZeile u{text-decoration:none; font-size:10px; letter-spacing:.12em;
    text-transform:uppercase;}
</style>
</head>
<body>
<canvas id="feld"></canvas>

<div id="agRing"></div>
<div id="agEcke"><div id="agLaeuft"></div></div>
<div id="agRufe"></div>
<div id="agSteck"></div>
<div id="agKostenEbene"></div>
<div id="agStand"></div>
<div id="agWerk"></div>
<div id="agWerkName"></div>
<div id="agKopf"><b>Agentarium</b><em>See intelligence move. Powered by BALL</em><i id="agProjekt"></i><span id="agUhr">00:00</span></div>
<div id="agWas"></div>
<div id="agMotoren"></div>
<div id="agTun"></div>
<div id="agStoppSchilder"></div>
<div id="agStopp"></div>
<div id="agTasten"><button id="agListe" type="button" class="an">Was geschieht</button><button id="agMotor" type="button">LLM &amp; Kosten</button>
<button id="agLeg" type="button">Gesetz</button>
<button id="agHalt" type="button">Halt</button>
<button id="agVorn" type="button">Von vorn</button></div>
<div id="agGesetz"></div>
<p id="hinweis">Du darfst mitrühren</p>
<script>
(function () {
  'use strict';

  /* ======================================================================
     Resonanz — Versuch R (Schwaches verblasst, Starkes bleibt)

     Zwei Schichten:

       MEDIUM        Vierzehntausend Fäden, die immer antworten. Wer die
                     Fläche berührt, schiebt sie — ausnahmslos, sofort.
                     Sie leuchten nach ihrer Geschwindigkeit und sind in
                     Ruhe unsichtbar.

       NIEDERSCHLAG  Was liegen bleibt. Geschrieben wird nur, solange der
                     Wirbel in Resonanz ist. Danebengegriffenes wirbelt
                     sichtbar und verschwindet spurlos.

     Die Selektivität sitzt nicht zwischen Nichts und Etwas, sondern
     zwischen zwei Antworten: Der Wirbel sammelt sich oder er zerfällt.
     Beides ist zu sehen, nur eines schreibt.

     Das Vorbild ist die Schaukel. Man kann sie nicht in beliebigem Takt
     anschieben — man schiebt im Takt oder man bremst sie. Der Takt ist
     dabei nicht versteckt: Er ist die Drehzahl des Wirbels, den man selbst
     erzeugt hat, und die sieht man. Solange wenig Energie da ist, nimmt der
     Kern fast jeden Takt an; mit wachsender Energie wird er wählerisch.
     ==================================================================== */

  /* Die Strenge des Feldes. In den festen Fassungen steht sie ein für alle
     Mal; im Pult wird sie bei jedem Zugriff neu gelesen, damit sich auch
     daran drehen lässt. */
  var STIMMUNG = {
    get sigma()   { return 3.2; },    /* Wie eng der Takt getroffen sein muss */
    get stoerung(){ return 0.7; },    /* Wie schnell Danebengreifen zerlegt   */
    get zerfall() { return 0.14; },  /* Grundzerfall, auch bei allem richtig  */
    get aufbau()  { return 1.7; },   /* Wie schnell Treffer Energie sammeln   */
    get schwelle(){ return 0.20; }  /* Ab wann Farbe liegen bleibt           */
  };

  /* --- Deterministische Grundlage: fester Zeitschritt, gesäter Zufall.
         Kostet jetzt nichts und wäre später kaum nachzurüsten. ---------- */
  var SEED = (Math.random() * 4294967296) >>> 0;
  function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;var t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};}
  var rnd = mulberry32(SEED);
  var DT = 1/120, MAX_SUB = 4;

  /* Lebenszeichen: Jede Wirkung trägt ein, wann sie zuletzt wirklich gefeuert
     hat. Das Pult macht daraus ein Leuchten — damit man sieht, welche Bewegung
     eine Wirkung ruft, statt es erklärt zu bekommen. */
  var PULS = window.PULS || (window.PULS = {});
  function puls(k) { PULS[k] = performance.now(); }

  var N = 14000;            /* Fäden */
  var SCHWEIF = 0.125;      /* Länge des Schweifs in Sekunden Bewegung */
  var KERNE_MAX = 10;   /* neun Agenten, einer frei */

  var cv = document.getElementById('feld');
  var gl = cv.getContext('webgl2', { alpha:false, antialias:false, premultipliedAlpha:false, preserveDrawingBuffer:false })
        || cv.getContext('webgl',  { alpha:false, antialias:false, premultipliedAlpha:false, preserveDrawingBuffer:false });
  if (!gl) { document.getElementById('hinweis').textContent = 'WebGL fehlt'; return; }

  /* ---------------------------------------------------------------- Shader */
  var vsFaden =
    'attribute vec2 aPos;' +
    'attribute vec4 aPar;' +
    'attribute float aGr;' +
    'attribute float aHl;' +            /* x = Helligkeit, y = Hitze */
    'uniform vec2 uRes;' +
    'uniform float uPunkt;' +
    'varying float vA; varying float vH; varying float vAuf; varying float vTon;' +
    'varying float vGr; varying float vHl;' +
    'void main(){' +
    '  vec2 n = (aPos / uRes) * 2.0 - 1.0;' +
    '  gl_Position = vec4(n.x, -n.y, 0.0, 1.0);' +
    '  gl_PointSize = uPunkt * (1.0 + aGr * 0.9);' +
    '  vA = aPar.x; vH = aPar.y; vAuf = aPar.z; vTon = aPar.w; vGr = aGr; vHl = aHl;' +
    '}';

  var fsFaden =
    'precision mediump float;' +
    'varying float vA; varying float vH; varying float vAuf; varying float vTon;' +
    'varying float vGr; varying float vHl;' +
    'uniform float uStaerke; uniform float uPunktModus; uniform float uHitzeTor;' +
    'uniform float uFarbwahl; uniform float uKurve;' +
    'void main(){' +
    /* Die Farbe ist die Identität. In Resonanz wählte vTon zwischen zwei
       Familien; hier läuft es um den ganzen Kreis, damit neun Agenten
       unterscheidbar bleiben. Die Hitze bleibt, was sie war: Sie entscheidet
       über Sättigung und Helligkeit, nicht über den Ton. Ein kalter Faden ist
       fast grau — die Farbe eines Agenten wird erst sichtbar, wo er wirkt. */
    '  float h = fract(vTon);' +
    '  vec3 rad = clamp(abs(fract(h + vec3(0.0, 0.6667, 0.3333)) * 6.0 - 3.0) - 1.0, 0.0, 1.0);' +
    '  rad = rad * rad * (3.0 - 2.0 * rad);' +
    '  float glut = clamp(vH * 0.80 + (vHl - 0.45) * 0.55, 0.0, 1.0);' +
    '  float satt = 0.30 + 0.70 * clamp(glut * 1.5, 0.0, 1.0);' +
    '  vec3 c = mix(vec3(0.62, 0.66, 0.76), rad, satt);' +
    '  c *= 0.30 + 1.25 * glut;' +
    '  c = mix(c, vec3(1.0, 0.97, 0.90), clamp((glut - 0.62) * 1.7, 0.0, 1.0));' +
    /* Korn war unbedingt weiß — Faktor 1,0, an nichts gebunden. Für Funken
       ist das richtig: Sie sind weißglühend. Aber damit kann kein Korn je
       eine Farbe haben, und ein goldener Ball aus Korn ist unmöglich.
       Jetzt hängt das Weiß an der HITZE statt an der Art: Weißglühend wird,
       was weißglühend ist. Funken liegen bei Hitze 0,9 und kommen damit auf
       94 % Weiß — praktisch unverändert. Darunter bleibt die Farbe. */
    '  c = mix(c, vec3(1.0, 0.98, 0.95),' +
    '          step(0.001, vGr) * smoothstep(0.55, 0.95, vH));' +
    '  float a = vA * uStaerke * mix(1.0, vH * vAuf, uHitzeTor);' +
    '  if (uPunktModus > 0.5) {' +
    '    float d = length(gl_PointCoord - vec2(0.5));' +
    '    if (vGr > 0.001) { a *= smoothstep(0.34, 0.0, d) * (0.9 + vGr * 1.6); }' +
    '    else { a *= smoothstep(0.5, 0.0, d) * 0.55; }' +
    '  }' +
    '  gl_FragColor = vec4(c * a, a);' +
    '}';

  var vsQuad =
    'attribute vec2 aXY; varying vec2 vUV;' +
    'void main(){ vUV = aXY * 0.5 + 0.5; gl_Position = vec4(aXY, 0.0, 1.0); }';
  var fsQuad =
    'precision mediump float; varying vec2 vUV; uniform sampler2D uTex;' +
    'void main(){ gl_FragColor = texture2D(uTex, vUV); }';

  /* Was liegen bleibt, soll nicht alles liegen bleiben. Schwaches verblasst,
     Starkes steht. Die Grenze läuft über die Helligkeit: Ein Schmier von 0,04
     ist in Sekunden fort, ein Wirbelarm von 0,30 bleibt. Damit räumt sich das
     Bild selbst auf, ohne dass das Werk verschwindet. */
  var fsBlass =
    'precision mediump float; varying vec2 vUV; uniform sampler2D uTex;' +
    'uniform float uSchwach, uStark, uAbzug, uMindest;' +
    'void main(){' +
    '  vec4 c = texture2D(uTex, vUV);' +
    '  float L = max(max(c.r, c.g), c.b);' +
    '  float g = smoothstep(0.04, 0.30, L);' +      /* 0 = schwach, 1 = stark */
    '  float f = mix(uSchwach, uStark, g);' +
    /* Multiplizieren allein kommt bei 8 Bit nie an: Ein Pixel bei 0,4 mal
       0,9962 rundet auf sich selbst zurück. Beim Schwachen räumt ein kleiner
       Abzug auf — und wo auch das Starke vergehen SOLL, muss er überall
       greifen, sonst friert das Bild auf halbem Weg ein und rührt sich nie
       wieder. Steht das Starke auf „für immer", ist uMindest null. */
    '  vec3 o = c.rgb * f - ((1.0 - g) * uAbzug + uMindest);' +
    '  gl_FragColor = vec4(max(o, vec3(0.0)), 1.0);' +
    '}';

  function shader(typ, quelle) {
    var s = gl.createShader(typ); gl.shaderSource(s, quelle); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  function programm(vs, fs) {
    var p = gl.createProgram();
    gl.attachShader(p, shader(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    return p;
  }

  var pFaden = programm(vsFaden, fsFaden), pQuad = programm(vsQuad, fsQuad);
  var lPos = gl.getAttribLocation(pFaden, 'aPos'), lPar = gl.getAttribLocation(pFaden, 'aPar'),
    lGr = gl.getAttribLocation(pFaden, 'aGr'),
    lHl = gl.getAttribLocation(pFaden, 'aHl');
  var uRes = gl.getUniformLocation(pFaden, 'uRes'),
      uPunkt = gl.getUniformLocation(pFaden, 'uPunkt'),
      uStaerke = gl.getUniformLocation(pFaden, 'uStaerke'),
      uPunktModus = gl.getUniformLocation(pFaden, 'uPunktModus'),
      uHitzeTor = gl.getUniformLocation(pFaden, 'uHitzeTor'),
      uFarbwahl = gl.getUniformLocation(pFaden, 'uFarbwahl'),
      uKurve = gl.getUniformLocation(pFaden, 'uKurve');
  var lXY = gl.getAttribLocation(pQuad, 'aXY'), uTex = gl.getUniformLocation(pQuad, 'uTex');
  var pBlass = programm(vsQuad, fsBlass);
  var lXY2 = gl.getAttribLocation(pBlass, 'aXY'), uTex2 = gl.getUniformLocation(pBlass, 'uTex'),
      uSchwach = gl.getUniformLocation(pBlass, 'uSchwach'),
      uStark = gl.getUniformLocation(pBlass, 'uStark'),
      uAbzug = gl.getUniformLocation(pBlass, 'uAbzug'),
      uMindest = gl.getUniformLocation(pBlass, 'uMindest');

  var vboFaden = gl.createBuffer();
  var vboQuad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vboQuad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);

  /* ------------------------------------------------------ Niederschlag-FBO */
  var fbo = null, tex = null, fbo2 = null, tex2 = null, BW = 0, BH = 0;
  function zielBauen(w, h) {
    var t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    var f = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    return { f: f, t: t };
  }
  function fboBauen(w, h, erhalten) {
    var altTex = tex, altFbo = fbo, altTex2 = tex2, altFbo2 = fbo2;
    var a = zielBauen(w, h); fbo = a.f; tex = a.t;
    if (1) { var b2 = zielBauen(w, h); fbo2 = b2.f; tex2 = b2.t; }
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);

    /* Beim Drehen des iPads wird der Puffer neu angelegt. Das Bild soll das
       überleben — es ist das Werk, nicht ein Zwischenstand. */
    if (erhalten && altTex) {
      gl.viewport(0, 0, w, h);
      gl.disable(gl.BLEND);
      gl.useProgram(pQuad);
      gl.bindBuffer(gl.ARRAY_BUFFER, vboQuad);
      gl.enableVertexAttribArray(lXY); gl.vertexAttribPointer(lXY, 2, gl.FLOAT, false, 0, 0);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, altTex);
      gl.uniform1i(uTex, 0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    if (altTex) { gl.deleteTexture(altTex); gl.deleteFramebuffer(altFbo); }
    if (altTex2) { gl.deleteTexture(altTex2); gl.deleteFramebuffer(altFbo2); }
    BW = w; BH = h;
  }

  /* Halbwertszeiten in Sekunden: was schwach ist, was stark ist.
     1e9 heißt: bleibt für immer. */
  var blassAkku = 0, abklingen = 0;
  /* Für die Schicht darüber: Räum die Fläche über so viele Sekunden.
     Der einzige Weg, ein Stück zu beenden und wieder von vorn beginnen zu
     lassen — ohne diesen Hahn bleibt der Niederschlag für immer, und das
     ist im laufenden Betrieb richtig, am Ende aber falsch. */
  window.__abklingen = function (sek) { abklingen = sek; };
  function verblassen(dt) {
    blassAkku += dt;
    if (blassAkku < 0.25) return;            /* höchstens viermal je Sekunde */
    var d = blassAkku; blassAkku = 0;
    puls('verblassen');
    /* Vergeht auch, was das Bild über sich selbst weiß? Ohne diese Zeile
       erinnert sich das Feld immer — und „alles vergeht" wäre in Wahrheit

          zaeh = Math.exp(-2.5 * Math.min(1, F.d) * dt);   /* dicke Farbe bremst */
        }
      }

      if (1 && korn[i] <= 0 && !fest[i]) {
        /* Ein Faden trifft einen Lichtpunkt. */
        var vs2 = vx[i]*vx[i] + vy[i]*vy[i];
        if (vs2 > 67600) {
          var u3 = (x / W * KX) | 0, v3 = (y / H * KY) | 0;
          if (u3 >= 0 && v3 >= 0 && u3 < KX && v3 < KY) {
            var t3 = kzelle[v3 * KX + u3];
            if (t3 >= 0 && lf[t3] > 0 && korn[t3] > 0.9) {
              puls('stoss'); funken(t3); lf[t3] = 0; korn[t3] = 0; kzelle[v3 * KX + u3] = -1;
            }
          }
        }
      }
      if (korn[i] > 0) {
        ax = 0; ay = 0;                        /* zuletzt, sonst schiebt das Bild */
        if (1 && korn[i] > 0.9 && lm[i] - lf[i] > 0.45) {
          var zer = 0;
          if (unten && handTempo > 130) {
            var hx2 = x - hx, hy2 = y - hy;
            if (hx2*hx2 + hy2*hy2 < 900) zer = 1;
          }
          if (!zer) for (var c2 = 0; c2 < kerne.length; c2++) {
            var W2 = kerne[c2];
            if (W2.s < 0.12) continue;
            var dv2 = W2.dvx*W2.dvx + W2.dvy*W2.dvy;
            if (dv2 < 4900) continue;            /* nur ein geworfener Wirbel */
            var kx2 = x - W2.x, ky2 = y - W2.y, rr2 = W2.r * 0.5;
            if (kx2*kx2 + ky2*ky2 < rr2*rr2) { zer = 1; break; }
          }
          if (zer) { puls('stoss'); funken(i); lf[i] = 0; korn[i] = 0; continue; }
        }
      }
      var nvx = (vx[i] + (ax - vx[i]) * 4.2 * dt) * reib * zaeh;
      var nvy = (vy[i] + (ay - vy[i]) * 4.2 * dt) * reib * zaeh;
      if (korn[i] > 0) { var kb = Math.exp(-7 * dt); nvx *= kb; nvy *= kb; }
      vx[i] = nvx; vy[i] = nvy;

      qx[i] = x; qy[i] = y;
      x += nvx * dt; y += nvy * dt;

      if (korn[i] > 0) {
        if (x < 0 || x > W || y < 0 || y > H) { lf[i] = 0; }
      } else if (0) {
        if (x < 0) { x += W; qx[i] = x; puls('umlauf'); }
        else if (x > W) { x -= W; qx[i] = x; puls('umlauf'); }
        if (y < 0) { y += H; qy[i] = y; puls('umlauf'); }
        else if (y > H) { y -= H; qy[i] = y; puls('umlauf'); }
      } else {
        /* Was hinausfliegt, ist fort. Nicht hart an der Kante — ein Rand von
           18 % lässt den Faden sichtbar davonfliegen statt an einer Wand zu
           verschwinden. Danach kommt er still und kalt irgendwo wieder herein,
           damit das Feld nicht ausdünnt und die Ruhebewegung bleibt. */
        if (x < -W * 0.18 || x > W * 1.18 || y < -H * 0.18 || y > H * 1.18) {
          x = rnd() * W; y = rnd() * H;
          vx[i] = 0; vy[i] = 0; hz[i] = 0;
          qx[i] = x; qy[i] = y;
        }
      }
      px[i] = x; py[i] = y;
    }
  }

  /* ---------------------------------------------------------- Darstellung */
  function puffern() {
    var j = 0;
    for (var i = 0; i < N; i++) {
      /* Hitze: nah an einem starken Kern wird es hell. */
      var h = 0, tonZiel = -1, hellZiel = -1, nahBest = 0;
      if (fest[i]) { h = hz[i]; }
      else
      for (var c = 0; c < kerne.length; c++) {
        var K = kerne[c];
        if (K.s < 0.05) continue;
        var ex = px[i] - K.x, ey = py[i] - K.y;
        var d = Math.sqrt(ex*ex + ey*ey);
        var nah = 1 - Math.min(1, d / (K.r * 1.35));
        var w = K.s * nah * nah;
        if (w > h) { h = w; tonZiel = K.ton; }
        if (nah > nahBest) { nahBest = nah; hellZiel = K.hell; }
      }
      if (!fest[i]) hz[i] += (h - hz[i]) * 0.16;
      if (tonZiel >= 0) tn[i] += (tonZiel - tn[i]) * 0.10;
      if (hellZiel >= 0) hl[i] += (hellZiel - hl[i]) * 0.10;

      var sx = vx[i], sy = vy[i];
      var tempo = Math.sqrt(sx*sx + sy*sy);
      var a = tempo / 380; if (a > 1) a = 1;
      a = a * a * (3 - 2 * a);
      a += hz[i] * 0.85; if (a > 1) a = 1;
      if (korn[i] > 0) {
        var ak = (korn[i] > 1.2 ? 0.86 + 0.14 * hz[i] : 0.24 + 0.72 * hz[i]) * wach;
        if (ak > a) a = ak;
      }
      /* Ein- und Ausblenden, damit nichts aufpoppt. Die Blende war fest
         0,6 s lang — das ist richtig für einen Faden, der mehrere Sekunden
         lebt, und falsch für alles Kurze: Ein Punkt mit 0,30 s Lebensdauer
         steckt die ganze Zeit in BEIDEN Blenden und kommt in seiner
         Lebensmitte auf 0,25 x 0,25, also ein Sechzehntel seiner
         Helligkeit. Mehr Material half dagegen nichts, es wurde nur
         gleichmäßig matt.
         Jetzt ist die Blende ein Drittel der eigenen Lebensdauer, höchstens
         aber 0,6 s. Für alles, was länger als 1,8 s lebt, ändert sich damit
         nichts. */
      var rest = lf[i], alt2 = lm[i] - lf[i];
      var blende = lm[i] < 1.8 ? lm[i] * 0.333 : 0.6;
      if (rest < blende) a *= rest / blende;
      if (alt2 < blende) a *= alt2 / blende;
      var sf = korn[i] > 0 ? 0 : SCHWEIF;
      var tx = px[i] - sx * sf, ty = py[i] - sy * sf;

      /* Wie viel Farbe nimmt die Fläche hier noch an? Wo schon viel liegt,
         wenig — sonst läuft alles zu. Und was aufgetragen wird, wandert ins
         Raster, damit es beim nächsten Zug lenkt. */
      var auf = ABGABE[art[i]] * abg[i];
      if (1 && schreibt) {
        var gu = (px[i] / W * GX) | 0, gv = (py[i] / H * GY) | 0;
        if (gu >= 0 && gv >= 0 && gu < GX && gv < GY) {
          var gk = gv * GX + gu;
          /* Das Aufnahme-Tor gehört zur sichtbaren Schicht: Es verhindert, dass
             das Bild zuläuft. Wo das Sichtbare vergeht, gibt es nichts zu
             schützen — dann verweigerte eine leer aussehende Stelle nur die
             Farbe, und das läse sich als Fehler statt als Geschichte. */
          var bremse = 1 ? Math.min(0.92, dich[gk] * 1.1) : 0;
          if (bremse > 0.12) puls('sog');
          auf *= 1 - bremse;
          if ((i & 7) === 0) {
            dich[gk] += a * hz[i] * auf * 0.115;
            if (dich[gk] > 1.6) dich[gk] = 1.6;
          }
        }
      }

      daten[j++] = tx * dpr; daten[j++] = ty * dpr; daten[j++] = a * 0.20; daten[j++] = hz[i]; daten[j++] = auf; daten[j++] = tn[i]; daten[j++] = korn[i]; daten[j++] = hl[i];
      daten[j++] = px[i] * dpr; daten[j++] = py[i] * dpr; daten[j++] = a;   daten[j++] = hz[i]; daten[j++] = auf; daten[j++] = tn[i]; daten[j++] = korn[i]; daten[j++] = hl[i];
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, vboFaden);
    gl.bufferData(gl.ARRAY_BUFFER, daten, gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(lPos); gl.vertexAttribPointer(lPos, 2, gl.FLOAT, false, 32, 0);
    gl.enableVertexAttribArray(lPar); gl.vertexAttribPointer(lPar, 4, gl.FLOAT, false, 32, 8);
    if (lGr >= 0) { gl.enableVertexAttribArray(lGr); gl.vertexAttribPointer(lGr, 1, gl.FLOAT, false, 32, 24); }
    if (lHl >= 0) { gl.enableVertexAttribArray(lHl); gl.vertexAttribPointer(lHl, 1, gl.FLOAT, false, 32, 28); }
  }

  function faedenZeichnen(staerke, punkt, tor) {
    gl.useProgram(pFaden);
    gl.uniform2f(uRes, BW, BH);
    gl.uniform1f(uStaerke, staerke);
    gl.uniform1f(uPunkt, punkt);
    gl.uniform1f(uPunktModus, punkt > 1.5 ? 1 : 0);
    gl.uniform1f(uHitzeTor, tor || 0);
    gl.uniform1f(uFarbwahl, 0.0);
    gl.uniform1f(uKurve, 1.0);
    gl.drawArrays(punkt > 1.5 ? gl.POINTS : gl.LINES, 0, N * 2);
  }

  function zeichnen() {
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);            /* additiv, Farbe ist vormultipliziert */
    puffern();

    /* 1) Niederschlag: nur solange der Wirbel in Resonanz ist. */
    if (schreibt) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
      gl.viewport(0, 0, BW, BH);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);   /* deckend, nicht addierend */
      faedenZeichnen(0.1400, 1.0, 1);
      faedenZeichnen(0.1400 * 0.5, 5.0, 1);        /* weicher Auftrag daneben */
      gl.blendFunc(gl.ONE, gl.ONE);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    }

    if (1) verblassen(rahmenDt);

    /* 2) Bildschirm: erst das Liegengebliebene, dann das Lebendige. */
    gl.viewport(0, 0, BW, BH);
    gl.disable(gl.BLEND);
    gl.clearColor(0.020, 0.027, 0.047, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(pQuad);
    gl.bindBuffer(gl.ARRAY_BUFFER, vboQuad);
    gl.enableVertexAttribArray(lXY); gl.vertexAttribPointer(lXY, 2, gl.FLOAT, false, 0, 0);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.uniform1i(uTex, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.bindBuffer(gl.ARRAY_BUFFER, vboFaden);
    gl.enableVertexAttribArray(lPos); gl.vertexAttribPointer(lPos, 2, gl.FLOAT, false, 32, 0);
    gl.enableVertexAttribArray(lPar); gl.vertexAttribPointer(lPar, 4, gl.FLOAT, false, 32, 8);
    if (lGr >= 0) { gl.enableVertexAttribArray(lGr); gl.vertexAttribPointer(lGr, 1, gl.FLOAT, false, 32, 24); }
    if (lHl >= 0) { gl.enableVertexAttribArray(lHl); gl.vertexAttribPointer(lHl, 1, gl.FLOAT, false, 32, 28); }
    faedenZeichnen(0.55, 1.0, 0);  /* Fäden  */
    faedenZeichnen(0.22, 7.0, 0);  /* Glühen */
  }

  /* -------------------------------------------------------------- Schleife */
  var letzterRahmen = performance.now(), rest = 0, rahmenDt = 0;
  function rahmen(t) {
    var dt = Math.min(0.05, (t - letzterRahmen) / 1000);
    letzterRahmen = t; rahmenDt = dt;
    rest += dt;
    if (window.__agSchritt) window.__agSchritt(dt);
    var n = 0;
    while (rest >= DT && n < MAX_SUB) { if (1) feldAbklingen(DT); kerneRechnen(DT); if (1) filamente(DT);
      if (1) korngeben(DT);
      if (1) kornRasterFuellen(); mediumRechnen(DT); rest -= DT; n++; }
    if (n === MAX_SUB) rest = 0;
    if (1 && (glaettZaehler++ % 20) === 0) rasterGlaetten();
    zeichnen();
    if (window.__abzugBitte) {
      var pw = cv.width, ph = cv.height, roh = new Uint8Array(pw * ph * 4);
      gl.readPixels(0, 0, pw, ph, gl.RGBA, gl.UNSIGNED_BYTE, roh);
      window.__abzug = { w: pw, h: ph, d: roh };
      window.__abzugBitte = 0;
    }
    requestAnimationFrame(rahmen);
  }

  function messen() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = cv.clientWidth, h = cv.clientHeight;
    if (w === W && h === H) return false;
    W = w; H = h;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    return true;
  }

  /* Gerechnet wird durchgehend in CSS-Punkten; erst beim Puffern wird auf
     Gerätepunkte skaliert. Sonst müsste jede Konstante zweimal stimmen. */
  function aufbauen(erhalten) {
    messen();
    fboBauen(cv.width, cv.height, erhalten);
    saeen();
  }
  aufbauen(false);

  window.addEventListener('resize', function () {
    if (cv.clientWidth === W && cv.clientHeight === H) return;
    aufbauen(true);
  });

  requestAnimationFrame(rahmen);
})();
</script>
