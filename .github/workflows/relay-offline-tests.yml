name: Agentarium Relay — offline authorization checks
on:
  push:
    paths:
      - '.github/workflows/relay-offline-tests.yml'
permissions:
  contents: read
jobs:
  validate-no-api:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9bb7ce6596a343a2697b0f1011e8bca9981a78af
          persist-credentials: false
      - name: Negative authorization tests without Claude API
        run: |
          python3 relay/one_shot.py --self-test
          python3 relay/test_role_routing.py
