name: Forge local live connection to Original
on:
  push:
    branches: [agent/ball-live-concept-20261017]
    paths: ['handoffs/AG-BALL-LIVE-001-forge-original-activate.json']
permissions:
  contents: read
  issues: write
concurrency:
  group: agentarium-forge-original-live-v1
  cancel-in-progress: false
jobs:
  forge:
    if: github.repository == 'pahlborn/agentarium' && github.repository_owner_id == '277496791' && github.actor_id == '277496791' && github.event_name == 'push' && github.ref_name == 'agent/ball-live-concept-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate relay syntax
        run: python3 -m py_compile relay/forge_ball_live_original_once.py
      - name: Install existing Claude CLI
        run: npm install --global @anthropic-ai/claude-code
      - name: Forge bounded implementation
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 relay/forge_ball_live_original_once.py
      - name: Preserve patch and raw handback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forge-ball-live-original-output
          path: forge-ball-live-original-output/
          if-no-files-found: warn
          retention-days: 14
