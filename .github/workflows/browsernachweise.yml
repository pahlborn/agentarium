# AG-PROOF-CI-001 — die Browsernachweise laufen hier, nicht im Container eines Agenten.
#
# WARUM ES DIESEN LAUF GIBT. Zweimal hintereinander blieb ein fertiger
# Kandidat liegen, weil der pruefende Agent kein ausfuehrbares Chromium hatte:
# #17 seit dem 18.10., Kriterium 3 von #40 am 20.10. Der Nachweis war beide
# Male in Ordnung -- nur konnte ihn ausser dem Autor niemand laufen lassen, und
# ein Nachweis, den nur sein Autor ausfuehren kann, belegt Wiederholbarkeit
# statt Unabhaengigkeit. Hier haengt er nicht mehr an einer Umgebung, sondern
# am Commit, und jeder kann das Ergebnis nachlesen.
#
# WAS HIER NICHT PASSIERT: kein Modellaufruf, kein Geheimnis, keine
# Aktivierung, kein Netz ausser npm und dem Browser-Download. Die Nachweise
# selbst tischen ihre Seiten auf 127.0.0.1 auf.
name: Browsernachweise

# PUSH NUR AUF `main`, PULL_REQUEST FUER JEDEN KANDIDATEN. Beides ohne
# Einschraenkung ergab zwei Ereignisse fuer denselben Kopf; die Nebenlaufgruppe
# unten brach dann eines davon ab -- und ein ABGEBROCHENER Pruefeintrag zaehlt
# fuer GitHub nicht als gruen. Gemessen an #42 (Kopf cec69a3) und an #40
# (Kopf 6dbbc1d): beide Kandidaten lasen danach `mergeable_state: unstable`,
# obwohl der zustaendige Lauf gruen war und kein Nachweis fehlschlug. Der
# Eintrag bleibt an dem Commit stehen, Warten half also nicht. So gibt es gar
# keinen zweiten Lauf, der abgebrochen werden muesste.
#
# BEWUSST IN KAUF GENOMMEN: Ein Zweig ohne offenen Kandidaten wird nicht
# geprueft. Die Nachweise entscheiden bei der Beurteilung eines Kandidaten und
# auf `main` -- davor liest sie niemand.
on:
  push:
    branches:
      - main
    paths:
      - 'previews/**'
      - 'pilot/github-live/**'
      - 'projekte/**'
      - '.github/workflows/browsernachweise.yml'
      - '.github/scripts/browsernachweise.sh'
  pull_request:
    paths:
      - 'previews/**'
      - 'pilot/github-live/**'
      # Das Projektverzeichnis pflegt Atlas von Hand; geprueft wird es von
      # previews/AG-PROJEKTE-001 -- also muss eine Aenderung daran den Lauf
      # ausloesen, sonst bliebe genau sie ungeprueft.
      - 'projekte/**'
      - '.github/workflows/browsernachweise.yml'
      - '.github/scripts/browsernachweise.sh'

# Nur Lesen. Dieser Lauf schreibt nichts, nirgends.
permissions:
  contents: read

# EIN LAUF JE KOPF, NICHT JE REF. `github.ref` ist bei push
# `refs/heads/...` und bei pull_request `refs/pull/N/merge` -- zwei
# verschiedene Gruppen fuer denselben Stand, also zwei Laeufe fuer dieselbe
# Frage. Der Kopf ist dagegen in beiden Faellen derselbe.
# Gefunden von Argus am 20.10.
#
# Die Gruppe bleibt, aber sie ist nicht mehr das Mittel gegen den Doppellauf
# -- das steht jetzt oben im Ausloeser. Sie faengt noch den Fall, der uebrig
# ist: denselben Kopf erneut angestossen (Wiederholung von Hand), wo der
# aeltere Lauf nichts mehr beantwortet.
concurrency:
  group: browsernachweise-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  # B4 (AG-CI-NACHWEISE-003, 30.10.): EIN EIGENER LAEUFER JE NACHWEIS.
  #
  # Warum. Der Volllauf auf `main` lief nacheinander auf einem Laeufer und
  # wuchs mit jedem Nachweis: 26.10. 18 Nachweise 718 s, 29.10. 22 Nachweise
  # 1001 s (Lauf 40895621368). Gleichzeitig auf EINEM Laeufer war rot
  # (Lauf 40459863327: geteilte Rechenleistung, Zeitablaeufe). Ein eigener
  # Laeufer je Nachweis teilt nichts -- jeder Nachweis laeuft so wie bisher
  # allein, nur alle zugleich. Lots Review in #89: tragfaehig, Ruestzeit je
  # Laeufer gemessen 23-34 s.
  #
  # Aufbau: `auswahl` bestimmt die Nachweise (Regeln unveraendert im Skript),
  # `nachweis` laeuft je Nachweis als eigener Job, `nachweise` sammelt das
  # Ergebnis unter dem bisherigen Namen. Gruen ist der Lauf nur, wenn alle
  # ausgewaehlten Nachweise gruen sind; kein Nachweis ausgewaehlt ist kein
  # Erfolg. Rueckgabe 2 ("ungeprueft") bleibt rot.

  auswahl:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      liste: ${{ steps.a.outputs.liste }}
      anzahl: ${{ steps.a.outputs.anzahl }}
    steps:
      - name: Kandidat holen, nicht einen festen Ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Bei `pull_request` zeigt GITHUB_SHA auf den Mischcommit; der Kopf
          # des Kandidaten ist `pull_request.head.sha`. Bei `push` ist beides
          # dasselbe.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Vergleichsstand bereitstellen
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          echo "geprüfter Commit : $(git rev-parse HEAD)"
          echo "Vergleichsstand  : $(git rev-parse origin/main)"

      # Regeln: `.github/scripts/browsernachweise.sh`, Funktion `auswahl`.
      # Auf `main` alle; im Pull Request die betroffenen (B0) bzw. der Kern
      # bei Monitor-Code (B2).
      - name: Auswahl der Browsernachweise
        id: a
        env:
          EREIGNIS: ${{ github.event_name }}
        run: |
          set -euo pipefail
          BASIS=""
          if [ "$EREIGNIS" = "pull_request" ]; then
            BASIS="$(git merge-base origin/main HEAD)"
          fi
          bash .github/scripts/browsernachweise.sh auswahl "$EREIGNIS" "$BASIS" > "$RUNNER_TEMP/auswahl.txt"
          echo "ausgewählt:"; sed 's/^/  /' "$RUNNER_TEMP/auswahl.txt"
          liste="$(sed -n 's#^previews/\([^/]*\)/pruefen\.js$#\1#p' "$RUNNER_TEMP/auswahl.txt" \
                   | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "liste=$liste" >> "$GITHUB_OUTPUT"
          echo "anzahl=$(printf '%s' "$liste" | jq 'length')" >> "$GITHUB_OUTPUT"

  nachweis:
    needs: auswahl
    if: needs.auswahl.outputs.anzahl != '0'
    name: nachweis (${{ matrix.id }})
    strategy:
      # Alle Ergebnisse sehen, nicht nur das erste Rot.
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.auswahl.outputs.liste) }}
    # DAS ABBILD IST FESTGENAGELT, UND ZWAR GEMESSEN.
    #
    # `ubuntu-latest` ist am 21.10.2026 zwischen 16:48 und 20:42 von
    # ubuntu-24.04 auf ubuntu-26.04 umgezogen. Damit brach die Installation mit
    #   "ERROR: Playwright does not support chromium on ubuntu26.04-x64"
    # Nachgelesen in den Laufprotokollen 39637128431, 39638041060 (gruen,
    # ubuntu-24.04) und 39672592846 (rot, ubuntu-26.04). Playwright steht
    # bewusst auf einer festen Nummer.
    runs-on: ubuntu-24.04
    # Je Nachweis; der laengste brauchte am 29.10. 175 s (EVENT-JOURNAL).
    timeout-minutes: 15
    steps:
      - name: Kandidat holen, nicht einen festen Ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Der Blocknachweis vergleicht gegen `origin/main` (`git show`).
          # Ohne die Geschichte endet er mit Rueckgabe 2, also ungeprueft.
          fetch-depth: 0
          persist-credentials: false

      - name: Vergleichsstand bereitstellen
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main

      # KEIN setup-node. Der Laeufer bringt Node mit, und ein Aktionspin
      # weniger ist einer weniger, den jemand nachsehen muss.
      - name: Playwright und Chromium, auf Fassung festgenagelt
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx --no-install playwright install --with-deps chromium

      - name: Browser nachweisen, bevor irgendetwas gruen werden kann
        run: |
          set -euo pipefail
          # KEIN BROWSER DARF NIE ALS BESTANDEN DURCHGEHEN.
          PFAD="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          echo "Node       : $(node --version)"
          echo "Playwright : $(node -e "console.log(require('playwright/package.json').version)")"
          echo "Chromium   : $PFAD"
          test -x "$PFAD" || { echo "::error::kein ausführbares Chromium unter $PFAD"; exit 1; }
          "$PFAD" --version

      # Derselbe Ablauf wie bisher, nur mit genau einem Nachweis: Rueckgabe
      # 1 und 2 sind rot, die Ausgabe steht gruppiert im Protokoll.
      - name: Nachweis ${{ matrix.id }}
        env:
          ID: ${{ matrix.id }}
        run: echo "previews/$ID/pruefen.js" | bash .github/scripts/browsernachweise.sh lauf

  nachweise:
    # Sammelstufe unter dem bisherigen Namen `nachweise`.
    needs: [auswahl, nachweis]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Gesamtergebnis
        env:
          AUSWAHL: ${{ needs.auswahl.result }}
          ANZAHL: ${{ needs.auswahl.outputs.anzahl }}
          NACHWEIS: ${{ needs.nachweis.result }}
        run: |
          set -euo pipefail
          echo "Auswahl: $AUSWAHL · ausgewählt: ${ANZAHL:-?} · Nachweise: $NACHWEIS"
          echo "### Browsernachweise: ${ANZAHL:-?} ausgewählt, Ergebnis $NACHWEIS" >> "$GITHUB_STEP_SUMMARY"
          if [ "$AUSWAHL" != "success" ]; then
            echo "::error::Auswahl nicht erfolgreich ($AUSWAHL)"; exit 1
          fi
          # Kein Nachweis gefunden ist kein Erfolg: sonst waere ein
          # verschobenes Verzeichnis ein gruener Lauf.
          if [ -z "$ANZAHL" ] || [ "$ANZAHL" = "0" ]; then
            echo "::error::kein previews/*/pruefen.js ausgewählt"; exit 1
          fi
          if [ "$NACHWEIS" != "success" ]; then
            echo "::error::mindestens ein Nachweis nicht bestanden ($NACHWEIS)"; exit 1
          fi
          echo "alle $ANZAHL Nachweise bestanden"
