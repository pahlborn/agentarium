name: Forge NACHTPOST runnable mocks
on:
  push:
    branches: [feature/visual-stage-v0]
    paths: ['.github/workflows/forge-nachtpost-v3.yml']
permissions:
  contents: read
  issues: write
jobs:
  mock:
    if: github.event.repository.private == true && github.ref_name == 'feature/visual-stage-v0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        variant: [gewebe, partitur]
    concurrency:
      group: agentarium-forge-nachtpost-v3-${{ matrix.variant }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate relay before paid call
        run: |
          python3 -m py_compile relay/claude_cli_diagnostics.py relay/claude_stream_diagnostics.py relay/forge_nachtpost_checkpoint_once.py
          python3 -m unittest -q relay/test_claude_cli_diagnostics.py relay/test_nachtpost_replay.py relay/test_claude_stream_diagnostics.py
      - run: npm install --global @anthropic-ai/claude-code
      - run: claude --version
      - name: One independent Forge mock handback
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 relay/forge_nachtpost_checkpoint_once.py ${{ matrix.variant }}
      - name: Preserve Forge output and usage even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nachtpost-003-${{ matrix.variant }}
          path: forge-checkpoints/${{ matrix.variant }}/
          if-no-files-found: warn
          retention-days: 14
