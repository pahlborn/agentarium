name: Forge ten newly occurring live events pilot
on:
  push:
    branches: [agent/mvp-ten-events-20261017]
    paths: ['handoffs/AG-PILOT-002-ten-live-events-activate.json']
permissions:
  contents: read
  issues: write
concurrency:
  group: agentarium-forge-ten-live-events-v1
  cancel-in-progress: false
jobs:
  forge:
    if: github.repository == 'pahlborn/agentarium' && github.repository_owner_id == '277496791' && github.actor_id == '277496791' && github.event_name == 'push' && github.ref_name == 'agent/mvp-ten-events-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate bounded relay syntax
        run: python3 -m py_compile relay/forge_ten_live_events_once.py relay/claude_cli_diagnostics.py
      - name: Install existing Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code
      - name: Architecture-first bounded Forge session
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 relay/forge_ten_live_events_once.py
      - name: Preserve real handback, patch and usage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forge-ten-live-events-output
          path: forge-ten-live-events-output/
          if-no-files-found: warn
          retention-days: 14
