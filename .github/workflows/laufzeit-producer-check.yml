name: AG-LAUFZEIT-001 producer offline checks
on:
  push:
    branches: ['agent/ag-laufzeit-qa-*']
    paths: ['.github/workflows/laufzeit-producer-check.yml']
permissions:
  contents: read
jobs:
  offline:
    if: github.repository == 'pahlborn/agentarium' && github.actor_id == '277496791'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile production host and targeted tests; no model or API key
        run: python3 -m py_compile relay/claude_public_relay_v2.py relay/claude_runtime_events.py relay/test_runtime_events.py
      - name: Targeted runtime identity, transport and failure cases
        run: python3 -m unittest discover -s relay -p test_runtime_events.py -v
      - name: Existing unchanged relay security and contract self-test
        run: python3 relay/claude_public_relay_v2.py self-test
      - name: Actual owned-child cleanup on Linux; no model or key
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, sys, tempfile, time, os, signal
          sys.path.insert(0, 'relay')
          import claude_runtime_events as host
          for ignore_term in (False, True):
              with tempfile.TemporaryDirectory() as directory:
                  ready = pathlib.Path(directory) / 'ready'
                  code = "import signal,sys,time,pathlib; signal.signal(signal.SIGTERM, signal.SIG_IGN if sys.argv[2]=='yes' else signal.SIG_DFL); pathlib.Path(sys.argv[1]).write_text('ready'); time.sleep(120)"
                  child = subprocess.Popen([sys.executable, '-c', code, str(ready), 'yes' if ignore_term else 'no'], start_new_session=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  try:
                      deadline = time.monotonic() + 5
                      while not ready.exists() and time.monotonic() < deadline:
                          time.sleep(.05)
                      assert ready.exists(), 'owned fixture was not ready'
                      host.stop_child(child)
                      assert child.poll() in (-signal.SIGTERM, -signal.SIGKILL), child.returncode
                      if ignore_term:
                          assert child.returncode == -signal.SIGKILL
                      print('OWNED_CHILD_STOP_PASS', 'kill-fallback' if ignore_term else 'term', child.returncode)
                  finally:
                      if child.poll() is None:
                          os.killpg(child.pid, signal.SIGKILL)
                          child.wait(timeout=2)
          PY
