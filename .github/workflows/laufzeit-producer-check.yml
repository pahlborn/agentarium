name: AG-LAUFZEIT-001 producer offline checks
on:
  push:
    branches: ['agent/ag-laufzeit-qa-*']
    paths: ['.github/workflows/laufzeit-producer-check.yml']
permissions:
  contents: read
jobs:
  offline:
    if: github.repository == 'pahlborn/agentarium' && github.actor_id == '277496791'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile production host and targeted tests; no model or API key
        run: python3 -m py_compile relay/claude_public_relay_v2.py relay/claude_runtime_events.py relay/test_runtime_events.py
      - name: Targeted runtime identity, transport and failure cases
        run: python3 -m unittest discover -s relay -p test_runtime_events.py -v
      - name: Existing unchanged relay security and contract self-test
        run: python3 relay/claude_public_relay_v2.py self-test
