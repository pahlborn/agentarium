name: Forge AG-MOTION-001 V2 independent variants
on:
  push:
    branches: [feature/visual-stage-v0]
    paths: ['.github/workflows/forge-motion-v2.yml']
permissions:
  contents: read
  issues: write
jobs:
  variant:
    if: github.event.repository.private == true && github.ref_name == 'feature/visual-stage-v0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        variant: [gewebe, partitur]
    concurrency:
      group: agentarium-motion-v2-${{ matrix.variant }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m py_compile relay/forge_motion_variant_once.py
      - run: npm install --global @anthropic-ai/claude-code
      - name: One smaller contribution, no retry
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 relay/forge_motion_variant_once.py ${{ matrix.variant }}
