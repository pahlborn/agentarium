<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Agentarium</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Resonanz">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05070C">
<style>
  :root{ --grund:#05070C; --agHell:1; }
  html,body{margin:0;padding:0;width:100%;height:100%;background:var(--grund);}
  html{overflow:hidden;overscroll-behavior:none;touch-action:none;}
  body{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;touch-action:none;}
  canvas{
    position:fixed; inset:0; width:100%; height:100%; display:block;
    background:var(--grund); touch-action:none;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  }
  #hinweis{
    position:fixed; left:0; right:0; bottom:max(22px, env(safe-area-inset-bottom));
    text-align:center; pointer-events:none;
    font:400 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing:.22em; text-transform:uppercase; color:#4B5A72;
    transition:opacity 1.2s ease;
  }
  #kopf{
    position:fixed; left:0; right:0; top:max(14px, env(safe-area-inset-top));
    text-align:center; pointer-events:none; z-index:3;
    font:400 13px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing:.26em; text-transform:uppercase; color:#7B8AA6;
  }
  #kopf b{display:block; font-weight:400; font-size:17px; color:#C9D4E6; letter-spacing:.20em;}
  #kopf i{display:block; font-style:normal; font-size:11px; color:#4B5A72; letter-spacing:.16em;
          text-transform:none; margin-top:5px;}
  #tuer{
    position:fixed; right:max(12px, env(safe-area-inset-right));
    bottom:max(12px, env(safe-area-inset-bottom));
    z-index:6; pointer-events:auto; -webkit-tap-highlight-color:transparent;
    width:46px; height:46px; border-radius:23px; border:1px solid rgba(160,180,210,.16);
    background:rgba(10,14,22,.30); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center;
    color:rgba(180,198,224,.42); font:400 17px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    transition:opacity .6s ease, background .2s ease; opacity:.55;
  }
  #tuer:active{background:rgba(20,28,42,.55);}
  #leiste{
    position:fixed; right:max(12px, env(safe-area-inset-right));
    bottom:calc(max(12px, env(safe-area-inset-bottom)) + 56px);
    z-index:6; display:none; flex-direction:column; gap:1px;
    background:rgba(150,170,200,.12); border:1px solid rgba(150,170,200,.12);
    border-radius:10px; overflow:hidden; min-width:172px;
  }
  #leiste.auf{display:flex;}
  #leiste a, #leiste button{
    appearance:none; border:0; text-align:left; cursor:pointer;
    display:block; padding:13px 17px; background:rgba(9,13,20,.86);
    color:#C2CEE2; text-decoration:none;
    font:400 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.14em;
    text-transform:uppercase; -webkit-tap-highlight-color:transparent;
  }
  #leiste a:active, #leiste button:active{background:rgba(22,30,45,.95);}
  #ruf{
    position:fixed; left:0; right:0; bottom:calc(max(12px, env(safe-area-inset-bottom)) + 72px);
    z-index:7; text-align:center; pointer-events:none; opacity:0;
    transition:opacity .5s ease; color:#9FB0CC;
    font:400 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.2em;
    text-transform:uppercase;
  }
  #ruf.da{opacity:1;}
  #agRing{position:fixed; inset:0; pointer-events:none; z-index:3;}
  /* Der Steckbrief eines Agenten: beim Daraufzeigen, beim Antippen. */
  #agSteck{position:fixed; z-index:9; width:270px; padding:15px 17px;
    border-radius:10px; background:rgba(8,12,19,.96);
    border:1px solid rgba(150,170,200,.18);
    font:400 12px/1.5 -apple-system,system-ui,sans-serif; color:#AEBCD2;
    opacity:0; pointer-events:none; transition:opacity .25s ease;}
  #agSteck.auf{opacity:1;}
  #agSteck b{font-weight:500; font-size:13px; letter-spacing:.14em;
    text-transform:uppercase;}
  #agSteck i{display:block; font-style:normal; color:#8295B0; font-size:11px;
    letter-spacing:.2em; text-transform:uppercase; margin-top:2px;}
  #agSteck code{display:block; margin-top:7px; color:#6B7689; font-size:10.5px;
    letter-spacing:.08em; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  #agSteck p{margin:11px 0 12px; color:#C8D4E6;}
  #agSteck dl{margin:0; display:grid; grid-template-columns:auto 1fr;
    gap:3px 12px; font-size:11px;}
  #agSteck dt{color:#6B7689; letter-spacing:.14em; text-transform:uppercase;
    font-size:9.5px; padding-top:2px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  #agSteck dd{margin:0; color:#AEBCD2;}
  #agSteck .nein{color:#A8707A;}
  #agSteck .schaetz{color:#9A8A62;}
  /* Was ein Auftrag verbraucht hat — erscheint beim Erledigen, verebbt. */
  #agKostenEbene{position:fixed; inset:0; z-index:5; pointer-events:none;}
  /* DIE GRIFFE. Sie liegen in einer eigenen Schicht ueber den Bloecken,
     nicht in ihnen: #agTasten hat overflow:hidden und wuerde einen Griff
     im Inneren abschneiden. So bleibt jeder Block unangetastet, und
     Knoepfe, Regler und Liste sind weiter voll bedienbar. */
  /* 13, NICHT 12, UND DAS IST GEMESSEN. Ein gelesener Block nimmt z-index 12
     (siehe "WO DIE HELLIGKEIT WIRKT" weiter unten). Bei gleichem Wert
     entscheidet die Reihenfolge im Dokument, und die Bloecke stehen SPAETER
     als diese Schicht -- der vergroesserte Block lag also ueber seinem
     eigenen Griff, und ein Druck darauf traf den Block. Der Zug begann nie;
     im Nachweis sah es aus wie "Block bewegt sich nicht". */
  #agGriffe{position:fixed; inset:0; z-index:13; pointer-events:none;}
  /* EIN DREIECK IN DER ECKE, UND NUR SOLANGE DER BLOCK VERGROESSERT IST.

     Drei Fassungen, drei Lehren, und alle drei stehen hier, damit die
     naechste nicht bei Nummer eins anfaengt:
     53 -- vier Punkte bei 28 % Deckkraft, sichtbar erst bei `:hover`. Ein
        Finger hat kein Hover; auf dem iPad war nichts zu finden.
     54 -- sichtbare Platte, 28 px fest. Peter am 20.10.: "im Browser auf dem
        laptop sind die anfasser fast zu klein, im ipad jedoch zu groß. sie
        skalieren also nicht mit der anzeige." Richtig, und die Ursache war
        die einzige feste Zahl in einer Oberflaeche, die sonst durchweg am
        Fenster gemessen ist.
     55 -- ein Dreieck, am Fenster gemessen, und es erscheint nur, wenn der
        Block ohnehin vergroessert ist. Im Betrieb ist das Bild damit leer.

     KASTEN UND BILD SIND VERSCHIEDEN GROSS, UND DAS IST ABSICHT: Der Kasten
     nimmt den Zeiger und ist so gross wie der Daumen braucht; das Dreieck
     darin ist das, was man sieht. Ein Dreieck, das so gross waere wie sein
     Tastbereich, waere wieder ein Moebel.
     Untergrenze 20 px, damit auf dem iPad genug zum Fassen bleibt;
     Obergrenze 34, damit es auf einem breiten Schirm nicht gross wird,
     sondern nur mitwaechst. */
  #agGriffe .agGriff{position:absolute;
    width:clamp(20px, 1.7vw, 34px); height:clamp(20px, 1.7vw, 34px);
    pointer-events:auto; cursor:grab; touch-action:none;
    opacity:0; transition:opacity .2s ease;
    background:linear-gradient(135deg, rgba(201,162,39,.92) 0%,
                                       rgba(201,162,39,.62) 62%,
                                       rgba(201,162,39,0) 63%);
    -webkit-clip-path:polygon(0 0, 100% 0, 0 100%);
    clip-path:polygon(0 0, 100% 0, 0 100%);}
  /* `wach` setzt die Nachfuehrung, nicht der Mauszeiger: die Schicht liegt
     ueber dem Block, ein `:hover` des Blocks erreicht sie nicht. */
  #agGriffe .agGriff.wach{opacity:.9;}
  @media (hover:hover){
    #agGriffe .agGriff.wach:hover{opacity:1;}}
  #agGriffe .agGriff.faengt{opacity:1; cursor:grabbing;}
  /* Schlaegt jede Vergroesserung, auch die mit `:hover` -- deshalb hier und
     nicht in der Gruppe oben, und deshalb mit `!important`: `:hover` auf
     einer ID ist spezifischer als eine Klasse. */
  .ziehtGerade{transform:none !important;}
  #agGriffe.leise{opacity:0; pointer-events:none;}
  .agKosten{position:absolute; transform:translate(-50%,-100%);
    font:400 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.12em; white-space:nowrap;
    animation:agKostenEin 16s ease forwards;}
  /* Geschätztes kursiv und in Klammern: Es muss sich als geschätzt zu
     erkennen geben, auch ohne dass jemand den Steckbrief öffnet. */
  .agKosten.geschaetzt{font-style:italic; opacity:.8;}
  .agKosten.geschaetzt::before{content:'~';opacity:.6;padding-right:3px;}
  /* Sechzehn Sekunden statt sechs, und der Aufstieg ist flacher. Vorher
     war die Zahl weg, bevor man sie gelesen hatte — und sie wanderte dabei
     so weit nach oben, dass sie sich schon im Verschwinden befand, während
     man noch hinsah. Jetzt steht sie fast die ganze Zeit still. */
  @keyframes agKostenEin{0%{opacity:0;transform:translate(-50%,-80%);}
    5%{opacity:1;transform:translate(-50%,-100%);}
    84%{opacity:1;transform:translate(-50%,-108%);}
    100%{opacity:0;transform:translate(-50%,-122%);}}
  /* Die Namen atmen durchgehend — ein Team, das wartet, ist nicht tot.
     Der Wechsel Name <-> Rolle fällt in das Tal dieses Atems, deshalb
     sieht man kein Umspringen, sondern nur, dass beim Hellwerden etwas
     anderes dasteht. */
  .agName{position:absolute; transform:translate(-50%,-50%); touch-action:none;
    font:400 var(--agNameGr,14px)/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing:.2em; text-transform:uppercase;
    white-space:nowrap; opacity:.7;
    animation:agAtem 4s ease-in-out infinite;}
  /* Das Atmen darf nicht zum Verstecken werden. Vorher ging es von 0,30 bis
     0,66 — im Tal war der Name praktisch weg, und zusammen mit 11 px war er
     nicht mehr zu lesen. Jetzt 0,52 bis 0,88: Man sieht den Atem immer
     noch, aber man muss ihn nicht abwarten, um den Namen zu erkennen. */
  @keyframes agAtem{0%,100%{opacity:.52;} 50%{opacity:.88;}}
  /* Wer arbeitet, leuchtet — damit man es auch am Rand des Blicks bemerkt. */
  /* Wer arbeitet, atmet tiefer und schneller. */
  .agName.arbeitet{animation:agPuls 2.4s ease-in-out infinite;}
  /* Wer gleich fängt, schwillt an — und zwar ohne Übergangszeit: Eine
     Erwartung, die sanft einblendet, kommt zu spät. Das Zurückgehen
     danach darf weich sein. */
  .agName.faengt{opacity:1 !important; animation:none;
    transition:transform .12s ease-out;}
  .agName{transition:transform .5s ease;}
  @keyframes agPuls{0%,100%{opacity:.80;} 50%{opacity:1;}}
  /* ============ DER PULS AM NAMEN -- EINMAL, KURZ ============

     DIE KLASSE WAR DA, DIE REGEL NICHT. `pulsAn` setzt `agGhPuls` am
     Namensschild, erzwingt einen Umbruch, damit die Animation neu anläuft,
     und nimmt die Klasse nach 1600 ms wieder weg -- seit AG-GH-LIVE-001.
     Nur gab es im ganzen Stilblatt keine Regel, die auf `agGhPuls` passt.
     Die Klasse war also wirkungslos: drei Zeilen Code, geschrieben für eine
     sichtbare Wirkung, die nie ankam. Nachgesehen mit einer Suche über die
     Datei, nicht vermutet — und messbar, weil `getComputedStyle` ohne
     Regel einfach den Atem weitermeldet.

     Sentinel hat am 21.10. gemeldet, die Klasse allein beweise die
     Sichtbarkeit nicht. Das ist richtig und war noch zu freundlich: Sie
     bewies gar nichts, weil nichts auf sie hörte. Peters „kein ball, keine
     aktivität, totenstille" hat hier eine seiner Ursachen — ein `progress`
     erzeugte Feldteilchen, aber am Agenten selbst rührte sich nichts.

     Die Regel steht NACH `.agName.arbeitet`: gleiche Spezifität (zwei
     Klassen), also gewinnt die spätere. Stünde sie davor, überschriebe das
     ruhige Dauer-Atmen eines arbeitenden Agenten den kurzen Puls -- genau
     bei dem, bei dem er am meisten zählt.

     Einmal, nicht endlos (`1`), und 1,6 s lang wie der Timer im Code: Ein
     Puls, der länger leuchtet als seine Klasse lebt, bricht mitten im Bild
     ab. */
  .agName.agGhPuls{animation:agGhPulsAn 1.6s ease-out 1; opacity:1;}
  @keyframes agGhPulsAn{
    0%{opacity:1; letter-spacing:.42em;}
    16%{opacity:1; letter-spacing:.25em;}
    100%{opacity:.70; letter-spacing:.2em;}}
  /* Erstes Pult: Wer vorgezogen sitzt, steht auch etwas deutlicher da. */
  /* Wer außerhalb des Kreises steht, steht auch anders da: etwas größer
     und weiter gesperrt. Kein Abzeichen — nur ein anderer Ton. */
  .agDraussen{font-size:calc(var(--agNameGr,14px) * 1.11); letter-spacing:.34em;}
  /* Die Rolle ist laenger als der Name und bekommt eine Stufe weniger,
     damit zwei Nachbarn sich nicht decken. */
  .agName.rolleDa{font-size:calc(var(--agNameGr,14px) * 0.86);
    letter-spacing:.13em;}
  /* Der Umschlag Name <-> Rolle: Die Schrift läuft auseinander und wieder
     zusammen, als würde das Wort im Feld neu gegossen — kein Ausblenden. */
  @keyframes agGuss{
    0%{letter-spacing:.85em; opacity:0; filter:blur(3px);}
    45%{letter-spacing:.2em; opacity:1; filter:blur(0);}
    100%{letter-spacing:.2em;}}
  /* Beim Umschlag läuft die Schrift kurz auseinander und wieder zusammen —
     dann übernimmt wieder der Atem. */
  .agGuss{animation:agGuss 1.3s cubic-bezier(.2,.7,.3,1) both,
                    agAtem 4s ease-in-out infinite;}

  /* Oben links EINE Liste. Sie wechselt zwischen dem, was zu tun ist, und
     dem, was geschehen ist — zwei Listen nebeneinander waren zu viel.
     Die Überschrift sagt, welche gerade steht; ohne sie müsste man raten. */
  /* Die Liste steht UNTEN und wächst nach oben: Der neueste Eintrag liegt
     immer direkt über der Beschriftung, ältere rücken hinauf und laufen
     oben aus dem Bild. Vorher hing sie oben und wurde unten abgeschnitten
     — da verschwand das NEUESTE, und das ist genau falsch herum.
     Die Maske oben lässt sie ins Nichts auslaufen statt an einer Kante
     abzureißen. */
  /* Die Liste hängt unter dem Kopf und wächst nach UNTEN, höchstens vier
     Einträge weit. Vorher lief sie von unten nach oben über den ganzen
     Schirm und verschwand oben im Nichts — eindrucksvoll, aber sie nahm
     dem Geschehen den Platz und war beim Vorbeisehen nicht zu fassen.
     Vier Einträge sind das, was man im Vorbeigehen liest. */
  /* Unten links, der neueste Eintrag ganz unten — dort sucht das Auge
     das Neueste. Höchstens vier; der älteste rückt oben hinaus und läuft
     in der Maske aus, statt an einer Kante abzureißen. */
  #agEcke{position:fixed; left:max(14px,env(safe-area-inset-left));
    bottom:calc(max(14px,env(safe-area-inset-bottom)) + 10px);
    z-index:4; pointer-events:none; width:min(42vw,330px);
    display:flex; flex-direction:column; justify-content:flex-end;
    overflow:hidden; transition:opacity .45s ease;
    -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 46px);
    mask-image:linear-gradient(to bottom, transparent 0, #000 46px);}
  #agEcke.leise{opacity:0;}
  /* Im Ausklang verblasst die Liste von selbst — langsamer als beim
     Wegschalten, denn hier geht nichts aus, hier klingt etwas ab. */
  #agEcke.ausklang{opacity:0; transition:opacity 4.5s ease;}
  /* Im Hochformat ist die Liste schmaler, sonst bliebe für das Feld
     kein Band übrig. Dieselbe Zahl steht in der Schicht (`listeBreite`);
     gehen die beiden auseinander, rechnet das Feld mit einem Platz, den es
     nicht hat. */
  @media (orientation:portrait){
    #agEcke{width:min(34vw,240px);}
  }
  #agLaeuft{flex:0 0 auto;}
  /* Die Beschriftung „Was geschieht" ist jetzt ein Knopf unten rechts,
     bei den anderen. Hier bleibt nichts stehen. */
  #agTitel{display:none;}
  #agLaeuft{font:400 12px/1.45 -apple-system,system-ui,sans-serif;}
  .agAuf{margin-bottom:11px; transition:opacity .8s ease;}
  /* Ein offener Auftrag steht hell. Was geschehen ist, steht blass — die
     Liste sagt damit zweierlei zugleich, wofür es vorher zwei brauchte. */
  .agAuf.offen{opacity:1;}
  /* WIE BLASS DARF "GESCHEHEN" SEIN? Peter am 23.10.: "liste ist zu
     schwach". Nachgerechnet gegen den dunkelsten Grund (`--grund`
     #05070C, ohne das Licht des Feldes) und gegen die Textfarbe der
     Zeile (#C2CEE2):

       Deckkraft   Kontrast    vs. .offen
       .42         2,93:1      5,95x      <- war hier, unter AA
       .60         4,95:1      2,94x
       .62         5,23:1      2,75x      <- jetzt
       .75         7,30:1      1,85x         zu nah an .offen

     ZWEI Bedingungen zugleich, und darum ist es keine Geschmacksfrage:
     Lesbar heisst 4,5:1 (AA, 12px), und die Liste muss WEITER zweierlei
     sagen koennen -- was offen ist, steht hell, was geschehen ist, blass.
     Bei .75 verschwindet der Unterschied, auf den die ganze Liste gebaut
     ist. .62 erfuellt beides.

     BEFUND BEIM MESSEN, und er ist groesser als diese Zeile: Die zweite
     Bedingung greift im LIVEBETRIEB gar nicht. `auftrag` in `stromZeile`
     verlangt `!E.beobachtet`, und `beobachtet` tragen ALLE Live-
     Ereignisse. Es gibt dort also keine einzige `.offen`-Zeile -- die
     ganze Liste stand blass, und zwar bei 2,93:1. Der Kommentar oben
     ("damit sagt eine Liste zwei Dinge zugleich") gilt nur fuer Demo und
     Archiv. Das erklaert Peters Befund vollstaendig und ist nicht mit
     dieser Deckkraft behoben: Dass eine beobachtete Uebergabe kein
     offener Auftrag ist, war eine Entscheidung (AG-GH-LIVE-004) -- dass
     die Liste live damit ihre zweite Aussage verliert, war keine.
     Gemeldet, nicht mitgeaendert; es ist eine Aenderung am Bild.

     OFFEN, und nicht mitgeaendert: Die Herkunftszeile und `em` tragen
     #8295B0 und kommen damit auch bei .62 nur auf 3,11:1. Das waere eine
     Aenderung an der Farbe, nicht an der Deckkraft -- eine Stufe mehr und
     eine Entscheidung Peters. Gemeldet, nicht gemacht.
     NACHTRAG 46-5: entschieden und umgesetzt, siehe "DIE HERKUNFTSZEILE WAR
     SCHWARZ" weiter unten -- die Herkunftszeile war nicht #8295B0. */
  .agAuf.tat{opacity:.62;}
  .agAuf.tat s{text-decoration:none; font-size:9px; letter-spacing:.16em;
    text-transform:uppercase;}
  .agAuf u{text-decoration:none;
    font:400 10px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.22em;}
  .agAuf b{font-weight:500; font-size:11px; letter-spacing:.1em;
    text-transform:uppercase; opacity:.75;}
  .agAuf span{color:#C2CEE2;}
  .agAuf em{font-style:normal; color:#B0C0D7; font-size:9px;
    letter-spacing:.16em; text-transform:uppercase;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  /* DIE HERKUNFTSZEILE WAR SCHWARZ (gemessen am 23.10., Aufgabe 46-5).
     `small.agHerkunft` hatte keine eigene Farbe; der Adapter setzt nur
     `opacity:.75`. Sie erbte also Schwarz und stand in einer geschehenen
     Zeile (.62) mit 1,03:1 auf dem Grund -- unsichtbar. Die Annahme oben
     ("#8295B0, 3,11:1") galt nur fuer `em`.
     Peters Entscheidung vom 23.10.: lesbar machen. #B0C0D7 erreicht bei .62
     mindestens 4,5:1 und bleibt blasser als der Text (#C2CEE2), damit die
     Rangfolge der Zeile bleibt. Volle eigene Deckkraft, denn mit .75 kaeme
     selbst #C2CEE2 nur auf 3,36:1. Die Rechnung steht im Nachweis
     (AG-EVENT-JOURNAL-001, Teil O2), nicht hier. */
  #agLaeuft .agAuf small.agHerkunft{color:#B0C0D7; opacity:1;}
  /* Der Verlauf steht nicht mehr in einer Spalte, sondern dort, wo er
     geschieht — am Empfänger, nach außen geschrieben, und er vergeht. */
  #agRufe{position:fixed; inset:0; z-index:4; pointer-events:none;}
  /* Die Beschriftung des Werks: leuchtet bei der Abnahme auf, verebbt
     wieder. Mittig gesetzt, denn dort wächst es. */
  #agWerk{position:fixed; inset:0; z-index:5; pointer-events:none;}
  /* DAS PRODUKT: SCHRIFT UND EIN WAAGERECHTER BALKEN.

     Es sitzt unten in der Mitte des freien Bandes, nicht im Feld. Damit
     kann es nichts überlagern und von nichts überlagert werden — und es
     besteht aus Schrift statt aus Fäden, also kann dort auch kein
     Fadenwerk stehenbleiben. */
  /* Das Produkt steht rechts oben — dort, wo sonst der Kopf stand. Es
     ist das Ziel der ganzen Übung, also bekommt es die Ecke, die das Auge
     nach dem Titel als zweites ansteuert. */
  /* Unter dem Kopf, mit einer Trennlinie dazwischen: Es gehört zusammen
     (das ist das Projekt, das ist sein Stand), aber es ist nicht dasselbe. */
  /* DER FORTSCHRITT STEHT UNTEN RECHTS. Peter: "koennen wir bitte den
     block mit projektfortschritt nach rechts unten setzen". Oben bleibt
     damit nur, WELCHES Projekt laeuft -- unten steht, WIE WEIT es ist.
     Der Abstand nach unten haengt an der gemessenen Hoehe der
     Knopfleiste, nicht an einer Zahl: Auf dem Telefon bricht sie um. */
  #agWerkName{position:fixed;
    right:max(3px,calc(env(safe-area-inset-right) - 10px));
    bottom:calc(max(14px,env(safe-area-inset-bottom)) + var(--agTastenH,44px) + 12px);
    width:min(32vw,320px); z-index:6;
    opacity:0; transition:opacity 1.2s ease;
    text-align:right; color:#AEBCD2;}
  @media (orientation:portrait){
    #agWerkName{width:min(40vw,260px);}
  }
  #agWerkName.auf{opacity:.72;}
  #agWerkName.hell{opacity:1;}
  .wBalken{height:3px; border-radius:2px; overflow:hidden;
    background:rgba(150,170,200,.17); margin-bottom:9px;}
  .wBalken span{display:block; height:100%; background:#8FA3C0;
    transition:width 1.4s ease, background 2s ease;}
  #agWerkName.hell .wBalken span{background:#E8D9A8;
    box-shadow:0 0 10px rgba(232,217,168,.75);}
  .wTitel{font:400 10px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.22em; text-transform:uppercase;
    overflow-wrap:anywhere;}
  .wOrt{margin-top:6px; font:400 8.5px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.24em; text-transform:uppercase; opacity:.6;}
  /* EIN BLOCK, EINE REIHENFOLGE: was es ist, wie weit, wovon wieviel,
     woraus es besteht. Vorher stand die Aufschluesselung unten rechts in
     einem zweiten Block, der denselben Aufgabenzaehler zeigte. */
  .wZahl{margin-top:5px; font:400 9px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.18em; text-transform:uppercase; color:#8295B0;}
  .wAuf{margin-top:9px; padding-top:8px;
    border-top:1px solid rgba(150,170,200,.12);}
  .wAufZ{display:flex; align-items:center; justify-content:flex-end;
    gap:7px; margin-bottom:4px;}
  .wAufZ u{text-decoration:none; color:#55637A; order:1;
    font:400 8.5px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.2em; text-transform:uppercase; min-width:58px;
    text-align:right;}
  .wAufZ b{color:#9FAFC6; order:2; font-weight:400; min-width:14px;
    text-align:right;
    font:400 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;}
  .wAufZ i{display:flex; gap:2px; order:0;}
  .wAufZ s{display:block; width:3px; height:10px; text-decoration:none;}
  /* DAS REGISTER: woraus das Produkt besteht. Kennung, Fassung, Zustand —
     eine Fassung v2 ist der sichtbare Beweis einer Überarbeitung. */
  .wReg{margin-top:9px; padding-top:8px;
    border-top:1px solid rgba(150,170,200,.12);
    font:400 9px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.1em;}
  .wZeile{display:flex; justify-content:flex-end; gap:7px; white-space:nowrap;}
  .wZeile u{text-decoration:none; order:1;}
  .wZeile i{font-style:normal; order:2; color:#8295B0; min-width:20px;}
  .wZeile s{text-decoration:none; order:3; min-width:76px; text-align:right;
    text-transform:uppercase; font-size:8px; letter-spacing:.16em;
    color:#55637A;}
  .wZeile.z-angenommen s{color:#E8D9A8;}
  /* Die neuen Zustaende des Livebetriebs. `gemergt` und `veroeffentlicht`
     stehen HELLER als die Pruefung -- ein Ergebnis, das draussen ist, ist
     das Weiteste, was dieses Register sagen kann. Dieselbe Sprache wie
     `z-angenommen`, nur eine Stufe weiter; keine neue Farbe im Bild. */
  .wZeile.z-geliefert s{color:#8FA3C0;}
  .wZeile.z-gemergt s{color:#E8D9A8;}
  .wZeile.z-veroeffentlicht s{color:#E8D9A8; font-weight:500;}
  .wZeile.z-ersetzt{opacity:.45;}
  .wZeile.z-ersetzt s{text-decoration:line-through;}
  .wZeile.z-verworfen{opacity:.5;}
  .wZeile.z-verworfen s{color:#A8707A;}
  .wMehr{color:#55637A; font-size:8px; letter-spacing:.16em;
    text-transform:uppercase; margin-top:3px;}
  /* Die Beschriftung einer Abnahme. Diese drei Zeilen hatte einer meiner
     Schnitte beim Umbau mitgenommen — danach hatte das Element gar keine
     Positionierung mehr und klebte in der linken oberen Ecke, über dem
     Titel. Inline gesetzte `left`/`top` nützen nichts ohne `position`. */
  .agWerk{position:absolute; transform:translate(-50%,0); width:270px;
    text-align:center; animation:agWerkEin 8.6s ease forwards;}
  .agWerk span{display:block; color:#DCE5F3;
    font:400 13px/1.4 -apple-system,system-ui,sans-serif;
    text-shadow:0 0 16px rgba(0,0,0,.9), 0 0 5px rgba(0,0,0,.9);}
  .agWerk u{display:block; text-decoration:none; font-size:9px;
    letter-spacing:.3em; text-transform:uppercase; opacity:.7;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; margin-bottom:3px;}
  @keyframes agWerkEin{
    0%{opacity:0; transform:translate(-50%,8px); filter:blur(4px);}
    9%{opacity:1; transform:translate(-50%,0); filter:blur(0);}
    55%{opacity:1;} 100%{opacity:0;}}
  .agRuf{position:absolute; width:210px;
    font:400 11.5px/1.35 -apple-system,system-ui,sans-serif; color:#9FAFC6;
    animation:agEin 7.2s ease forwards;}
  .agRuf u{text-decoration:none; font-weight:500;}
  .agRuf s{text-decoration:none; font-size:9px; letter-spacing:.16em;
    text-transform:uppercase;}
  .agRuf span{color:#AEBCD2;}
  @keyframes agEin{0%{opacity:0;transform:translateY(5px);}
    7%{opacity:1;transform:none;} 62%{opacity:1;} 100%{opacity:0;}}
  /* Der Kopf steht links oben: Name, Projekt, Uhr. Klassisch, und genau
     deshalb lesbar — man sucht einen Titel oben links. */
  /* Kopf und Produkt stehen übereinander rechts oben: wer das hier ist,
     und was dabei herauskommt. Links unten läuft mit, was geschieht. */
  /* EINE SPALTE STATT ZWEIER FESTER LAGEN.

     Kopf und Produkt standen beide fest positioniert, das Produkt auf
     einem Abstand von 104 Pixeln unter dem oberen Rand. Ein fester Abstand
     ist hier das falsche Werkzeug: Die Kopfhöhe hängt vom Text und von der
     Breite ab. Im Hochformat bricht das Leitmotiv um, der Kopf wird höher —
     nachgemessen überlappten sich die beiden dort um zehn Pixel.

     Jetzt stehen sie in einer Spalte untereinander, und das Produkt folgt
     dem Kopf von selbst. Eine Klasse von Fehlern weniger. */
  #agRechts{position:fixed; right:max(3px,calc(env(safe-area-inset-right) - 10px));
    top:max(3px,calc(env(safe-area-inset-top) - 10px)); z-index:7;
    display:flex; flex-direction:column; align-items:flex-end; gap:6px;
    width:min(32vw,320px); pointer-events:none;}
  #agKopf{position:static; width:100%; text-align:right;
    font:400 11px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.2em; text-transform:uppercase; color:#55637A;}

  /* DIE MARKE STEHT LINKS, DER LAUF RECHTS.

     Vorher trug der Kopf rechts oben SECHS Dinge: Marke, Leitmotiv,
     Projektname, Uhr, Fassung, darunter das Produkt. Peter: „Das ist
     aktuell noch etwas unübersichtlich." Der Grund war nicht die Zahl,
     sondern die Vermischung: Die Marke ändert sich nie, der Lauf ändert
     sich dauernd. Zwei verschiedene Dinge in einem Block.

     Jetzt: links, was immer gleich bleibt — rechts, was gerade gilt.
     Links beginnt die Bahn erst bei bandL (348 im Querformat, 258 im
     Hochformat), der Platz ist also frei. Beim Zeigen wächst der Block
     nach rechts, deshalb ist er schmaler als der Raum: Hochformat 200
     statt 240, sonst stieß er vergrößert in die Bahn. */
  /* KLEINER. Peter: „das muss nicht so ueberpraesent sein."
     Er hat recht, und der Grund liegt nicht in der Ruhegroesse, sondern im
     Lesen: Auf dem iPad gibt es kein Zeigen, also setzt die Schicht bei
     JEDER Beruehrung kurz `lesen` — und damit wuchs die Marke bei jedem
     Antippen irgendwo im Feld auf 128 Prozent. Eine Marke, die bei jeder
     Beruehrung aufspringt, draengt sich auf.
     Also beides zurueck: Ruhegroesse 11/9 statt 13/10,5, und beim Lesen
     nur 1,10 statt 1,28. Sie ist der Name der Sache, nicht die Sache. */
  #agMarke{position:fixed; left:max(3px,calc(env(safe-area-inset-left) - 10px));
    top:max(3px,calc(env(safe-area-inset-top) - 10px)); z-index:7;
    width:min(26vw,220px); text-align:left;
    font:400 9.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.18em; text-transform:uppercase; color:#55637A;}
  #agMarke b{display:block; color:#AFC0D8; font-weight:400; font-size:11px;
    letter-spacing:.14em;}
  #agMarke em{display:block; font-style:normal; font-size:9px;
    letter-spacing:.08em; text-transform:none; color:#5E6E86;
    margin:2px 0 0; line-height:1.4;}
  @media (orientation:portrait){
    #agMarke{width:min(32vw,172px);}
  }
  /* Das Leitmotiv, wie es in AG-MOCK-COMPARE-001 steht. Klein, einmal, und
     es bleibt stehen — es ist der Name der Sache, keine Beschriftung. */
  /* 10,5 px statt 8,5 und etwas heller. Mit 8,5 war das Leitmotiv zwar
     da, aber nicht zu lesen — eine Beschriftung, die man nicht lesen kann,
     ist Dekoration. */

  /* Diese Regel muss NACH der Breitenangabe des Kopfes stehen. Beim ersten
     Versuch stand sie weiter oben bei der Liste — gleiche Gewichtung, also
     gewann die spätere Zeile, und der Kopf blieb im Hochformat 330 breit.
     Nachgemessen: rechter Rand bei 344 statt 254. */
  @media (orientation:portrait){
    #agRechts{width:min(40vw,260px);}
  }
  #agUhr{color:#8295B0;}

  /* ================= OB EIN STROM ANLIEGT, UND OB ER LEBT =================

     Peter: "ich wuerde gerne sehen, wenn agentarium im live modus laeuft.
     und ob ein datenstrom aktiv ist. nur ganz leise anzeige, nicht lautes,
     auffaelliges, stoerendes."

     Also kommt nichts Neues ins Bild. Die Uhr steht ohnehin oben rechts
     und zeigt im Live-Betrieb die Wirklichkeitszeit; sie bekommt einen
     Punkt davor. Drei Zustaende, und der erste ist die Abwesenheit:

       Demo/Archiv      kein Punkt. Es wird kein Strom erwartet, also
                        gibt es nichts zu melden.
       Strom lebt       der Punkt atmet EINMAL JE EMPFANGENEM
                        Lebenszeichen -- kein Takt, den das Feld selbst
                        erzeugt. Ein selbst erzeugter Puls behauptete
                        Leben, wo keines ist, und das waere die
                        gefaehrlichste Anzeige von allen.
       veraltet         der Punkt wird hohl und hoert auf zu atmen.
                        Dazu ein Wort, weil der Vertrag es verlangt:
                        nach 20 Sekunden ohne Lebenszeichen sagt das
                        Feld, seit wann.

     Kein Blinken, keine Signalfarbe. Dasselbe Atmen, das die Namen im
     Feld ohnehin haben. */
  #agPuls{display:none; width:5px; height:5px; border-radius:3px;
    text-decoration:none; vertical-align:middle; margin:0 7px 2px 0;
    background:#8FA3C0; opacity:.34;}
  body[data-strom="lebt"] #agPuls, body[data-strom="alt"] #agPuls{
    display:inline-block;}
  body[data-strom="alt"] #agPuls{background:transparent; opacity:.55;
    box-shadow:inset 0 0 0 1px #8295B0;}
  #agPuls.schlag{animation:agSchlag 1.7s ease-out;}
  @keyframes agSchlag{
    0%{opacity:.34; transform:scale(1);}
    10%{opacity:1; transform:scale(1.5);}
    100%{opacity:.34; transform:scale(1);}}
  #agStromWort{display:none; font-style:normal; color:#8295B0;
    font-size:8.5px; letter-spacing:.14em; margin-top:3px;}
  body[data-strom="alt"] #agStromWort{display:block;}

  /* DUNKEL BLEIBEN, ABER LESBAR WERDEN.

     Peters Bitte: „Die Anzeige für Titel und Produkt rechts oben und rechts
     unten für den kleinen Monitor sind erfreulich dunkel gehalten, ich mag
     das. Aber bei Mouseover erhellen, dass man es auch lesen kann, wäre
     toll."

     Also bleibt der Ruhezustand, wie er ist — und wer hinsieht, bekommt
     Licht. Auf dem iPad gibt es kein Zeigen, deshalb hört dieselbe Regel
     auch auf eine Berührung; die Schicht setzt dafür `lesen` und nimmt es
     nach ein paar Sekunden zurück.

     Die drei Ecken nehmen dafür Zeigerereignisse an. Das kostet dort das
     Mitrühren im Feld — ein kleiner Preis für eine Anzeige, die man lesen
     kann. */
  /* EIN GRUND UNTER DEM VERGRÖSSERTEN BLOCK.

     Peters Befund: „Wenn Titel und Zusatzdaten bei Mouseover vergrößert
     werden, durchscheint der Hintergrund, also der Titel des Projektes.
     Das ist ein wenig unruhig und hinderlich beim Lesen."

     Stimmt — vergrößerte Schrift über einem bewegten Feld ist schlechter
     lesbar als kleine. Die Polsterung liegt deshalb SCHON IM RUHEZUSTAND
     an, nur ohne Grund; sonst sprängen die Blöcke beim Zeigen um. Beim
     Zeigen kommt der dunkle Grund dazu, und die Blöcke stehen dann auf
     etwas statt im Feld. */
  #agMarke, #agKopf, #agWerkName{pointer-events:auto;
    padding:11px 13px; border-radius:10px;
    background:rgba(6,9,14,0); border:1px solid rgba(150,170,200,0);
    transition:opacity .3s ease, filter .3s ease, transform .3s ease,
               background .3s ease, border-color .3s ease;}
  #agMarke:hover, #agMarke.lesen,
  #agKopf:hover, #agKopf.lesen,
  #agWerkName:hover, #agWerkName.lesen{
    background:rgba(6,9,14,.93); border-color:rgba(150,170,200,.16);
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);}
  #agMarke:hover, #agMarke.lesen,
  #agKopf:hover, #agKopf.lesen,
  #agWerkName:hover, #agWerkName.lesen{filter:brightness(1.85) saturate(1.1);}

  /* WO DIE HELLIGKEIT WIRKT.

     Das Bild und die stillen Bloecke, nicht die Tafeln, die man zum Lesen
     aufmacht -- die sind schon hell, und heller wuerde dort blenden.

     Die Bloecke, die sich beim Lesen aufhellen, rechnen den Regler mit:
     Sonst waere der Unterschied zwischen "steht da" und "wird gelesen"
     bei hochgedrehtem Regler verschwunden, und genau der ist Absicht.

     `body.hellAn` ist der Schalter: Steht der Regler auf 1, gibt es
     ueberhaupt keinen Filter und damit auch keinen Durchgang auf der
     Grafikkarte. */
  body.hellAn #feld,
  body.hellAn #agRing, body.hellAn #agRufe, body.hellAn #agWerk,
  body.hellAn #agMotoren, body.hellAn #agTun,
  body.hellAn #agStoppSchilder, body.hellAn #agKostenEbene,
  body.hellAn #agEcke, body.hellAn #agTasten,
  body.hellAn #agMarke, body.hellAn #agKopf, body.hellAn #agWerkName{
    filter:brightness(var(--agHell));}
  body.hellAn #agMarke:hover, body.hellAn #agMarke.lesen,
  body.hellAn #agKopf:hover, body.hellAn #agKopf.lesen,
  body.hellAn #agWerkName:hover, body.hellAn #agWerkName.lesen{
    filter:brightness(calc(var(--agHell) * 1.85)) saturate(1.1);}
  /* Und sie werden größer. Heller allein reicht für kleine Schrift nicht —
     wer hinsieht, will lesen. Der Bezugspunkt ist die jeweilige ECKE,
     damit die Blöcke nach INNEN wachsen und nicht über den Rand hinaus. */
  #agKopf{transform-origin:top right;}
  #agWerkName{transform-origin:bottom right;}
  #agMarke{transform-origin:top left;}
  /* Wer gelesen wird, liegt OBEN. Vergroessert waechst ein Block von seiner
     Ecke nach innen und deckt dabei seinen Nachbarn teilweise zu — gemessen
     im Querformat: Kopf reicht vergroessert bis 269 px hinunter, das Produkt
     beginnt bei 92. Das ist kein Fehler, solange der gelesene Block
     DECKEND und OBEN ist; er hat beim Lesen Grund und Unschaerfe. Ohne
     diese Zeile entschied die Reihenfolge im Dokument, und das Produkt lag
     ueber dem Text, den man gerade lesen wollte. */
  #agMarke:hover, #agMarke.lesen,
  #agKopf:hover, #agKopf.lesen,
  #agWerkName:hover, #agWerkName.lesen{z-index:12;}
  #agKopf:hover, #agKopf.lesen,
  #agWerkName:hover, #agWerkName.lesen{transform:scale(1.28);}
  /* Die Marke waechst weniger: Sie muss nicht gelesen werden, sie steht da. */
  #agMarke:hover, #agMarke.lesen{transform:scale(1.10);}
  /* DIE LISTE WAECHST NUR AM ZEIGEGERAET, UND DAS IST KEINE SCHLAMPEREI.
     `#agEcke` traegt `pointer-events:none`, weil sie die untere linke Ecke
     des Feldes bedeckt -- mit Zeigerereignissen schluckte sie jeden Tipp auf
     einen Agenten, der dort steht (peter liegt auf 180 Grad, also links).
     Unter `hover:hover` gibt es einen Zeiger, der nur zeigt statt zu tippen;
     dort kostet es nichts. Auf einem Tastgeraet bliebe nur die Wahl zwischen
     "Liste verschiebbar" und "Agenten links antippbar", und die zweite ist
     mehr wert. Peter weiss es; es ist seine Entscheidung, nicht meine. */
  @media (hover:hover){
    #agEcke{pointer-events:auto; transform-origin:left bottom;
      transition:transform .3s ease, filter .3s ease, opacity .45s ease;}
    #agEcke:hover{transform:scale(1.10); filter:brightness(1.6) saturate(1.05);
      z-index:12;}}
  /* AUF DEM TASTGERAET HELLT DIE LISTE BEIM ANTIPPEN AUF -- Peters
     Entscheidung vom 23.10. (Aufgabe 46-5): "auf dem ipad funktionieren die
     anderen bloecke mit antippen".
     Die Abwaegung darueber bleibt gueltig, sie wird nur feiner geschnitten:
     Der KASTEN `#agEcke` nimmt weiter keine Beruehrung an, nur die SCHRIFT
     der Zeilen. Ein Tipp auf eine Zeile hellt die Liste auf wie Name, Kopf
     und Werkname (`lesen`, sechs Sekunden, siehe "Beruehren hellt auf");
     ein Tipp daneben -- zwischen die Zeilen, rechts neben den Text -- geht
     weiter durch zum Agenten darunter. Ist die Liste weggeschaltet oder
     ausgeklungen, nimmt auch die Schrift nichts an. */
  #agEcke .agAuf > *{pointer-events:auto;}
  #agEcke.leise .agAuf > *, #agEcke.ausklang .agAuf > *{pointer-events:none;}
  #agEcke{transform-origin:left bottom;
    transition:transform .3s ease, filter .3s ease, opacity .45s ease;}
  #agEcke.lesen{transform:scale(1.10); filter:brightness(1.6) saturate(1.05);
    z-index:12;}
  body.hellAn #agEcke.lesen{
    filter:brightness(calc(var(--agHell) * 1.6)) saturate(1.05);}
  #agWerkName:hover, #agWerkName.lesen{opacity:1;}
  /* Die Auskunft zum Namen: nur beim Zeigen, sonst nimmt sie Platz weg,
     den das Feld braucht. */
  #agFassung{display:block; max-height:0; overflow:hidden; opacity:0;
    transition:max-height .35s ease, opacity .35s ease, margin .35s ease;
    font:400 9px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.05em; text-transform:none; color:#6B7689;}
  #agMarke:hover #agFassung, #agMarke.lesen #agFassung{
    max-height:160px; opacity:1; margin-top:9px;}
  #agFassung b{display:block; margin-top:5px; font-weight:400; color:#AFC0D8;
    letter-spacing:.1em; font-size:8.5px;}
  /* DER HELLIGKEITSREGLER, UND ER IST LEISE.

     Peter: "kannst du einen helligkeitsregler einbauen? er sollte aber
     leise sein." Leise heisst hier: Er steht dort, wo ohnehin die Angaben
     zur Sache stehen -- in der Marke, die sich beim Beruehren oeffnet --
     und nicht als sechster Knopf unten. Ein Knopf waere eine Behauptung,
     dass man ihn oft braucht. Man braucht ihn einmal je Gerät.

     Er merkt sich seinen Wert im Geraet, nicht anderswo. */
  #agRegler{display:block; max-height:0; overflow:hidden; opacity:0;
    transition:max-height .35s ease, opacity .35s ease, margin .35s ease;}
  #agMarke:hover #agRegler, #agMarke.lesen #agRegler{
    max-height:60px; opacity:1; margin-top:10px;}
  #agRegler u{display:block; text-decoration:none; color:#6B7689;
    font-size:8px; letter-spacing:.2em; text-transform:uppercase;
    margin-bottom:5px;}
  #agRegler u i{font-style:normal; color:#AFC0D8; letter-spacing:.08em;}
  #agHell{-webkit-appearance:none; appearance:none; width:100%; height:14px;
    background:transparent; margin:0; cursor:pointer; display:block;}
  #agHell::-webkit-slider-runnable-track{height:2px; border-radius:1px;
    background:rgba(150,170,200,.26);}
  #agHell::-moz-range-track{height:2px; border-radius:1px;
    background:rgba(150,170,200,.26);}
  #agHell::-webkit-slider-thumb{-webkit-appearance:none; appearance:none;
    width:11px; height:11px; border-radius:6px; margin-top:-4.5px;
    background:#AFC0D8; border:0;}
  #agHell::-moz-range-thumb{width:11px; height:11px; border-radius:6px;
    background:#AFC0D8; border:0;}
  /* Welches Projekt gerade läuft — aus den Daten, nicht aus dem Code. */
  #agProjekt{display:block; font-style:normal; color:#8295B0; font-size:10px;
    letter-spacing:.22em; margin-bottom:2px;}
  #agProjekt.fragbar{pointer-events:auto; cursor:pointer;
    border-bottom:1px dotted rgba(150,170,200,.35); padding-bottom:1px;}
  /* Die Kurzbeschreibung auf Antippen — auf einem iPad gibt es kein
     Darüberfahren, also kein Tooltip, sondern ein Blatt. */
  /* DAS BLATT GEHOERT ZUM KOPF, ALSO SIEHT ES AUCH SO AUS.
     Peter: „die projektauswahl passt vom format nicht zur titelanzeige."
     Stimmt -- es war ein breites, linksbuendiges Blatt in Flaechenschrift
     unter einer schmalen, rechtsbuendigen Spalte in Schreibmaschinenschrift.
     Jetzt dieselbe Breite wie die Spalte, dieselbe Kante, rechtsbuendig. */
  #agWas{position:fixed; right:max(3px,calc(env(safe-area-inset-right) - 10px));
    top:calc(max(3px,env(safe-area-inset-top)) + 46px); z-index:9;
    width:min(32vw,320px); padding:13px 13px 15px; border-radius:10px;
    background:rgba(6,9,14,.96); border:1px solid rgba(150,170,200,.16);
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
    color:#C2CEE2; font:400 11px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.06em; text-align:right;
    opacity:0; transform:translateY(-6px); pointer-events:none;
    transition:opacity .35s ease, transform .35s ease;}
  @media (orientation:portrait){ #agWas{width:min(40vw,260px);} }
  body[data-gross="telefon-hoch"] #agWas{width:min(46vw,190px);}
  body[data-gross="telefon-quer"] #agWas{width:min(24vw,180px);}
  #agWas.auf{opacity:1; transform:none; pointer-events:auto;}
  /* Die Projektwahl sitzt im selben Blatt wie die Beschreibung: Was läuft
     und was es ist, gehören zusammen. */
  .wProjekte{list-style:none; margin:0 0 11px; padding:0 0 10px;
    border-bottom:1px solid rgba(150,170,200,.16);}
  .wProjekte li{cursor:pointer; padding:6px 0; color:#8EA0BA;
    font:400 10px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.22em; text-transform:uppercase;}
  .wProjekte li:hover{color:#D6E0F0;}
  .wProjekte li.hier{color:#E8D9A8;}
  .wProjekte li.hier::after{content:' —'; opacity:.7;}
  /* Die Betriebsart wird dort gewählt, wo man auch das Projekt wählt —
     sie gehört zum Projekt, nicht zur Bedienung. */
  .wModi{list-style:none; display:flex; gap:1px; margin:13px 0 8px; padding:0;
    border-radius:7px; overflow:hidden; background:rgba(150,170,200,.12);}
  .wModi li{flex:1; text-align:center; cursor:pointer; padding:8px 4px;
    background:rgba(9,13,20,.86); color:#8EA0BA;
    font:400 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.18em; text-transform:uppercase;}
  .wModi li.hier{background:rgba(20,27,39,.92); color:#E6EEFB;
    box-shadow:inset 0 1px 0 rgba(184,198,220,.34);}
  .wModusWas{color:#8295B0; font-size:11px; line-height:1.45;}
  /* Live ohne Verbindung: Das muss dastehen, nicht fehlen. */
  #agLive{position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    z-index:8; width:min(74vw,420px); padding:18px 20px; border-radius:12px;
    background:rgba(8,12,19,.95); border:1px solid rgba(201,162,39,.3);
    opacity:0; pointer-events:none; transition:opacity .5s ease;
    font:400 12.5px/1.55 -apple-system,system-ui,sans-serif; color:#C8D4E6;
    text-align:center;}
  #agLive.auf{opacity:1;}
  #agLive b{display:block; font-weight:500; color:#C9A227; font-size:11px;
    letter-spacing:.22em; text-transform:uppercase; margin-bottom:10px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  #agWas .wTitel{margin:0 0 7px; color:#D6E0F0; font-size:13px;}
  #agWas p{margin:0;}
  /* ========================== TELEFON ==========================
     Unten ist auf einem Telefon kein Platz fuer drei Dinge nebeneinander.
     Gemessen: Liste gegen Stand, Liste gegen Knoepfe, Stand gegen Knoepfe
     -- auf allen drei Telefonhoehen. Also:

       - der Stand unten rechts entfaellt. Er ist der Block, der den
         Aufgabenzaehler ein zweites Mal zeigt; im Produkt steht er auch.
       - die Liste rutscht UEBER die Knoepfe und wird schmaler.
       - die rechte Spalte wird schmaler, damit keine Namen hineinragen.

     Quer ist mehr Breite da, aber weniger Hoehe: dort bleibt der Stand,
     nur die Liste muss hoeher und schmaler. */
  /* Der Stand entfaellt auf JEDEM Telefon, nicht nur hochkant: Quer ist
     die Hoehe das Problem, und Kopf, Produkt und Stand uebereinander
     passen auf 375 Pixel Hoehe nicht -- gemessen, sie stiessen aneinander.
     Dass gerade dieser Block weicht, ist kein Zufall: Er zeigt den
     Aufgabenzaehler ein zweites Mal, und der steht auch im Produkt. */
  /* Gemessen nach dem Umzug: Liste links und Fortschritt rechts stiessen
     hochkant aneinander (375 Pixel, 225 + 150 + Raender). Beide schmaler,
     statt einen von beiden zu opfern. */
  /* Gemessen auf 375 Pixeln: 14 + 187 Liste + 178 Fortschritt = 379,
     also sieben Pixel Ueberschnitt. Schmaler wird der Fortschritt,
     nicht die Liste -- in der Liste stehen Peters Texte, hier Zahlen. */
  body[data-gross="telefon-hoch"] #agWerkName{width:min(36vw,135px);}
  body[data-gross="telefon-quer"] #agWerkName{width:min(28vw,200px);}
  body[data-gross="telefon-hoch"] #agEcke{
    width:min(50vw,187px);
    bottom:calc(max(14px,env(safe-area-inset-bottom)) + var(--agTastenH,52px) + 10px);}
  body[data-gross="telefon-hoch"] #agRechts{width:min(46vw,190px);}
  body[data-gross="telefon-hoch"] #agMarke{width:min(40vw,140px);}
  /* DIE KNOEPFE BRECHEN AUF DEM TELEFON UM. Gemessen: Die Leiste ist
     407 Pixel breit, das iPhone SE 375 -- "Was geschieht" stand 46 Pixel
     links ausserhalb des Bildes, auf dem iPhone 15 noch 28. Rechts
     verankert faellt immer der erste Knopf heraus, und das ist
     ausgerechnet der, den man zuerst braucht. Die Woerter bleiben wie
     sie sind; umbrechen darf die Leiste. */
  body[data-gross="telefon-hoch"] #agTasten,
  body[data-gross="telefon-quer"] #agTasten{
    left:max(6px,env(safe-area-inset-left));
    right:max(6px,env(safe-area-inset-right));
    flex-wrap:wrap; justify-content:flex-end;}
  body[data-gross="telefon-hoch"] #agTasten button,
  body[data-gross="telefon-quer"] #agTasten button{
    padding:9px 11px; letter-spacing:.10em;}
  /* AUF DEM TELEFON DIE ZUSAMMENFASSUNG, DAS DETAIL AUF ANTIPPEN.
     Gemessen: Der eine Block mit Titel, Balken, Zaehler, Aufschluesselung,
     Ablage und Register ist auf 667 Pixeln Hoehe so hoch, dass fuer den
     Kreis 30 Pixel blieben -- neun Namen auf einem Fingernagel. Oben
     stehen deshalb die drei Dinge, die die Frage "wie weit" beantworten;
     Aufschluesselung und Register kommen beim Lesen dazu. */
  body[data-gross="telefon-hoch"] #agWerkName .wAuf,
  body[data-gross="telefon-hoch"] #agWerkName .wReg,
  body[data-gross="telefon-hoch"] #agWerkName .wOrt{display:none;}
  body[data-gross="telefon-hoch"] #agWerkName:hover .wAuf,
  body[data-gross="telefon-hoch"] #agWerkName.lesen .wAuf,
  body[data-gross="telefon-hoch"] #agWerkName:hover .wReg,
  body[data-gross="telefon-hoch"] #agWerkName.lesen .wReg,
  body[data-gross="telefon-hoch"] #agWerkName:hover .wOrt,
  body[data-gross="telefon-hoch"] #agWerkName.lesen .wOrt{display:block;}
  body[data-gross="telefon-hoch"] #agWerkName:hover .wAufZ,
  body[data-gross="telefon-hoch"] #agWerkName.lesen .wAufZ{display:flex;}
  body[data-gross="telefon-quer"] #agEcke{
    width:min(34vw,200px);
    bottom:calc(max(14px,env(safe-area-inset-bottom)) + var(--agTastenH,48px) + 10px);}
  body[data-gross="telefon-quer"] #agRechts{width:min(24vw,180px);}
  body[data-gross="telefon-quer"] #agMarke{width:min(20vw,140px);}
  /* Beim Lesen nicht vergroessern, wo es keinen Platz dafuer gibt. */
  body[data-gross^="telefon"] #agKopf:hover,
  body[data-gross^="telefon"] #agKopf.lesen,
  body[data-gross^="telefon"] #agWerkName:hover,
  body[data-gross^="telefon"] #agWerkName.lesen{transform:scale(1.06);}
  body[data-gross^="telefon"] #agMarke:hover,
  body[data-gross^="telefon"] #agMarke.lesen{transform:none;}

  /* Der Stand der Arbeit, unten rechts über den Knöpfen. Keine Grafik,
     sondern Striche: Jeder Strich ist ein Stück Arbeit, und man kann sie
     zählen. Eine Kurve würde glätten, was gerade nicht glatt ist. */
  /* `pointer-events:auto`, nicht `none`: Die Tafel soll beim Zeigen
     aufhellen, und dafür muss sie den Zeiger überhaupt bemerken. Die Regel
     weiter oben hatte das schon gesetzt — diese hier stand später im
     Stylesheet und hat es bei gleicher Gewichtung wieder genommen. Genau
     derselbe Fehler wie bei der Kopfbreite im Hochformat. */
  /* Der Stilblock des alten Standes unten rechts ist ENTFALLEN -- mit dem
     Block selbst. Seine vier Groessen und der Aufgabenzaehler stehen jetzt
     im einen Block oben rechts; unten rechts bleiben nur die Knoepfe.
     Zwei Anzeigen, die nahezu dasselbe aussagten, sind eine geworden. */
  #agTasten{position:fixed; right:max(14px,env(safe-area-inset-right));
    bottom:max(14px,env(safe-area-inset-bottom)); z-index:11; display:flex; gap:1px;
    border-radius:8px; overflow:hidden; background:rgba(150,170,200,.12);}
  #agTasten button{appearance:none;border:0;cursor:pointer;padding:12px 16px;
    background:rgba(9,13,20,.82); color:#B8C6DC; pointer-events:auto;
    font:400 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.16em; text-transform:uppercase;
    -webkit-tap-highlight-color:transparent;}
  #agTasten button:active{background:rgba(22,30,45,.95);}
  /* Die Knöpfe gehen weg, wenn man sie nicht braucht — das Feld ist die
     Hauptsache, nicht die Bedienung. Sie kommen bei der kleinsten Bewegung
     zurück und bleiben, solange eine Tafel offen ist.
     Unsichtbar heißt auch unanklickbar: Ein blinder Treffer auf einen
     Knopf, den man nicht sieht, wäre schlimmer als ein zweites Antippen. */
  /* DIE TEMPOZEILE. Sie sitzt UEBER den Knoepfen, und zwar auf der Hoehe,
     die dort wirklich gemessen wurde (`--agTastenH`) -- nicht auf einer
     Zahl im Stylesheet. Auf dem Telefon bricht die Knopfleiste um; eine
     feste Zahl staende dann in den Knoepfen. Denselben Fehler gab es
     schon einmal mit 52 Pixeln fuer eine Reihe. */
  #agTempo{position:fixed; right:max(14px,env(safe-area-inset-right));
    bottom:calc(max(14px,env(safe-area-inset-bottom)) + var(--agTastenH, 44px) + 6px);
    z-index:11; display:flex; align-items:center; gap:10px;
    padding:9px 14px; border-radius:8px;
    background:rgba(9,13,20,.82); box-shadow:inset 0 0 0 1px rgba(150,170,200,.12);
    pointer-events:auto; transition:opacity .55s ease;}
  #agTempo.leise{opacity:0; pointer-events:none;}
  #agTempo label{color:#B8C6DC; white-space:nowrap;
    font:400 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.16em; text-transform:uppercase;}
  #agTempo label b{font-weight:400; color:#E6EEFB;}
  /* Der Regler selbst: dieselbe gedeckte Linie wie die Balken im Kopf.
     Der Griff ist 28 Pixel breit -- auf einem Finger ist alles darunter
     geraten. Apples eigene Vorgabe fuer eine Trefferflaeche ist 44; der
     Griff waechst nicht so weit, aber die Zeile um ihn herum ist hoch
     genug, dass die Flaeche zusammen hinkommt. */
  #agTempo input[type=range]{appearance:none; -webkit-appearance:none;
    width:min(34vw,148px); height:28px; background:transparent; margin:0;
    -webkit-tap-highlight-color:transparent;}
  #agTempo input[type=range]::-webkit-slider-runnable-track{
    height:2px; border-radius:1px; background:rgba(143,163,192,.34);}
  #agTempo input[type=range]::-moz-range-track{
    height:2px; border-radius:1px; background:rgba(143,163,192,.34);}
  #agTempo input[type=range]::-webkit-slider-thumb{appearance:none;
    -webkit-appearance:none; width:14px; height:14px; margin-top:-6px;
    border-radius:50%; background:#AFC0D8; border:0;}
  #agTempo input[type=range]::-moz-range-thumb{
    width:14px; height:14px; border-radius:50%; background:#AFC0D8; border:0;}
  #agTasten{transition:opacity .55s ease;}
  #agTasten.leise{opacity:0; pointer-events:none;}
  /* Angeschaltet heißt heller, nicht bunter. Vorher stand hier ein
     gesättigtes Blau — der einzige Farbblock in einem Bild aus gedeckten
     Tönen, und entsprechend fremd. Jetzt derselbe Grund, nur eine Stufe
     aufgehellt, und die Kante trägt die Auskunft. */
  #agTasten button.an{background:rgba(20,27,39,.92); color:#E6EEFB;
    box-shadow:inset 0 1px 0 rgba(184,198,220,.34);}
  /* Welches Modell an welcher Aufgabe sitzt — einblendbar, nicht ständig. */
  /* WER GERADE ARBEITET — und zwar an seinem Platz, nicht in einer Liste.
     Peters Frage: „Manchmal wartet man auf Aktion und es kommt nichts,
     weil wahrscheinlich ein Agent arbeitet und alle warten auf die
     Beendigung dieser." Genau das muss dastehen, sonst liest sich die
     Pause als Stillstand. */
  #agTun{position:fixed; inset:0; z-index:6; pointer-events:none;}
  /* Das Schild eines Stops. Es sitzt ÜBER dem Namen, während die
     Arbeitsanzeige darunter sitzt — beides zugleich kommt vor (ein Agent
     kann an einem Auftrag arbeiten und an einem anderen hängen). */
  #agStoppSchilder{position:fixed; inset:0; z-index:7; pointer-events:none;}
  .agStoppS{position:absolute; transform:translate(-50%,-100%);
    pointer-events:auto; cursor:pointer; text-align:center; white-space:nowrap;
    font:400 9px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.2em; text-transform:uppercase;
    -webkit-tap-highlight-color:transparent;}
  .agStoppS::after{content:''; display:block; width:1px; height:9px;
    margin:3px auto 0; background:currentColor; opacity:.5;}
  .agStoppS b{display:block; font-weight:400; opacity:.65;
    letter-spacing:.14em; text-transform:none;}
  /* Der Grund, auf Zeigen oder Antippen. */
  #agStopp{position:fixed; z-index:10; width:290px; padding:14px 16px;
    border-radius:10px; background:rgba(8,12,19,.97);
    border:1px solid rgba(150,170,200,.18);
    font:400 12px/1.5 -apple-system,system-ui,sans-serif; color:#C8D4E6;
    opacity:0; pointer-events:none; transition:opacity .2s ease;}
  #agStopp.auf{opacity:1;}
  #agStopp b{font-weight:500; font-size:11px; letter-spacing:.2em;
    text-transform:uppercase;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  #agStopp i{display:block; font-style:normal; color:#8295B0; font-size:10px;
    letter-spacing:.16em; text-transform:uppercase; margin-top:3px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  #agStopp p{margin:10px 0 9px;}
  #agStopp small{display:block; color:#8295B0; font-size:11px; line-height:1.45;
    padding-top:9px; border-top:1px solid rgba(150,170,200,.14);}
  .agTut{position:absolute; transform:translate(-50%,0); white-space:nowrap;
    font:400 9px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.2em; text-transform:uppercase; text-align:center;
    opacity:0; transition:opacity .8s ease;}
  .agTut.auf{opacity:.92;}
  .agTut b{font-weight:400; display:block; opacity:.62; letter-spacing:.14em;}
  /* Je länger alle warten, desto deutlicher. Die Pause selbst ist die
     Auskunft — nicht ein Zustand, den man wegdesignen müsste. */
  .agTut.lang{opacity:1;}
  .agTut.lang b{opacity:.95;}
  #agMotoren{position:fixed; inset:0; z-index:4; pointer-events:none;}
  .agMot{position:absolute; transform:translate(-50%,0); opacity:.5;
    font:400 10.5px/1.25 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.16em; text-transform:uppercase;
    /* Nicht breiter als der Platz zwischen zwei Agenten. Die Zahl setzt
       die Schicht aus den wirklichen Plaetzen; umbrechen ist besser, als
       in den Nachbarn zu laufen. */
    width:var(--agMotBr,170px); text-align:center;
    overflow-wrap:anywhere;}
  .agMot.tut{opacity:.95;}
  .agMot em{display:block; margin-top:3px; font-style:normal; font-size:9px;
    letter-spacing:.1em; text-transform:none; opacity:.8;}
  /* Eine Lücke sieht anders aus als eine Zahl — sonst liest man sie als
     Null. Gepunktet unterstrichen heißt „fehlt", nicht „ist null". */
  .agMot em.luecke{opacity:.95; color:#C9A227;
    text-decoration:underline dotted; text-underline-offset:3px;}
  .agMot em.leer{opacity:.42; font-style:italic;}
  .agKosten.nurZeit{opacity:.75;}
  /* Der Status der Kostenbasis. Er steht unten in der Mitte des Bandes,
     gut sichtbar, und er geht nicht weg — eine fehlende Anzeige liest man
     als Fehler, eine beschriftete als Auskunft. */
  /* UEBER die Knopfleiste, nicht darunter. Im Bild nachgesehen: Auf
     1194 Pixeln Breite endete der Satz bei 656 -- genau dort, wo die
     Leiste beginnt, und lief darunter weiter. Dieselbe gemessene Hoehe
     wie bei der Liste und beim Fortschritt. */
  .agBasis{position:absolute; left:var(--agBasisM,50%);
    max-width:var(--agBasisW,70vw); transform:translate(-50%,0);
    bottom:calc(max(14px,env(safe-area-inset-bottom)) + var(--agTastenH,44px) + 10px);
    font:400 9.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.18em; text-transform:uppercase; text-align:center;
    color:#6B7689;}
  .agBasis.luecke{color:#C9A227;
    text-decoration:underline dotted; text-underline-offset:4px;}
  .agMot em s{display:block; text-decoration:none; opacity:.75;
    color:#C9A227; font-size:8.5px;}
  .agAuf i.agMotor{font-style:normal; color:#6B7689; font-size:9px;
    letter-spacing:.16em; text-transform:uppercase;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}

  /* Die Legende: das Gesetz zum Nachlesen. Sie liegt über dem Feld und
     geht wieder weg — sie ist kein Teil des Bildes. */
  #agGesetz{position:fixed; inset:0; z-index:9; display:none;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    background:rgba(6,9,14,.93); color:#AFC0D8;
    padding:calc(max(18px,env(safe-area-inset-top)) + 8px)
            max(18px,env(safe-area-inset-right)) 96px
            max(18px,env(safe-area-inset-left));
    font:400 13px/1.5 -apple-system,system-ui,sans-serif;}
  #agGesetz.auf{display:block;}
  #agGesetz .gSatz{margin:0 0 26px; color:#D6E0F0; font-size:15px; line-height:1.6;
    max-width:40em;}
  #agGesetz .gSatz b{font-weight:500;}
  #agGesetz h4{margin:26px 0 8px; font-weight:400; font-size:11px;
    letter-spacing:.2em; text-transform:uppercase;}
  #agGesetz table{border-collapse:collapse; width:100%; max-width:46em;}
  #agGesetz td{padding:6px 12px 6px 0; vertical-align:top;
    border-top:1px solid rgba(150,170,200,.11);}
  #agGesetz .gArt{color:#7F8FA8; white-space:nowrap;
    font:400 11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;}
  #agGesetz .gWas{color:#C2CEE2;}
  #agGesetz .gRes{color:#7F8FA8; font-size:12px;}
  #agGesetz .gDau{color:#6B7689; font-size:11px; white-space:nowrap;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  #agGesetz .gFuss{margin:30px 0 0; color:#7F8FA8; max-width:40em;}
  .z-bleibt{color:#E8D9A8;} .z-verblasst{color:#8FA3C0;} .z-nichts{color:#6B7689;}
  .agZeile u{text-decoration:none; font-size:10px; letter-spacing:.12em;
    text-transform:uppercase;}
</style>
