<script>
(function () {
  'use strict';

  /* ======================================================================
     Resonanz — Versuch R (Schwaches verblasst, Starkes bleibt)

     Zwei Schichten:

       MEDIUM        Vierzehntausend Fäden, die immer antworten. Wer die
                     Fläche berührt, schiebt sie — ausnahmslos, sofort.
                     Sie leuchten nach ihrer Geschwindigkeit und sind in
                     Ruhe unsichtbar.

       NIEDERSCHLAG  Was liegen bleibt. Geschrieben wird nur, solange der
                     Wirbel in Resonanz ist. Danebengegriffenes wirbelt
                     sichtbar und verschwindet spurlos.

     Die Selektivität sitzt nicht zwischen Nichts und Etwas, sondern
     zwischen zwei Antworten: Der Wirbel sammelt sich oder er zerfällt.
     Beides ist zu sehen, nur eines schreibt.

     Das Vorbild ist die Schaukel. Man kann sie nicht in beliebigem Takt
     anschieben — man schiebt im Takt oder man bremst sie. Der Takt ist
     dabei nicht versteckt: Er ist die Drehzahl des Wirbels, den man selbst
     erzeugt hat, und die sieht man. Solange wenig Energie da ist, nimmt der
     Kern fast jeden Takt an; mit wachsender Energie wird er wählerisch.
     ==================================================================== */

  /* Die Strenge des Feldes. In den festen Fassungen steht sie ein für alle
     Mal; im Pult wird sie bei jedem Zugriff neu gelesen, damit sich auch
     daran drehen lässt. */
  var STIMMUNG = {
    get sigma()   { return 3.2; },    /* Wie eng der Takt getroffen sein muss */
    get stoerung(){ return 0.7; },    /* Wie schnell Danebengreifen zerlegt   */
    get zerfall() { return 0.14; },  /* Grundzerfall, auch bei allem richtig  */
    get aufbau()  { return 1.7; },   /* Wie schnell Treffer Energie sammeln   */
    get schwelle(){ return 0.20; }  /* Ab wann Farbe liegen bleibt           */
  };

  /* --- Deterministische Grundlage: fester Zeitschritt, gesäter Zufall.
         Kostet jetzt nichts und wäre später kaum nachzurüsten. ---------- */
  var SEED = (Math.random() * 4294967296) >>> 0;
  function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;var t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};}
  var rnd = mulberry32(SEED);
  var DT = 1/120, MAX_SUB = 4;

  /* Lebenszeichen: Jede Wirkung trägt ein, wann sie zuletzt wirklich gefeuert
     hat. Das Pult macht daraus ein Leuchten — damit man sieht, welche Bewegung
     eine Wirkung ruft, statt es erklärt zu bekommen. */
  var PULS = window.PULS || (window.PULS = {});
  function puls(k) { PULS[k] = performance.now(); }

  var N = 14000;            /* Fäden */
  var SCHWEIF = 0.125;      /* Länge des Schweifs in Sekunden Bewegung */
  /* Einer mehr als Agenten. Die Reserve ist nicht Zierde: `kernWaehlen`
     stiehlt, wenn alles besetzt ist, dem schwaechsten Kern den Platz --
     mitten im Leben, sichtbar. Mit lot sind es zehn Agenten; blieb die
     Zehn stehen, waere die Reserve lautlos weg und der Diebstahl erst
     dann zu sehen, wenn alle zugleich pulsen. */
  var KERNE_MAX = 11;   /* zehn Agenten, einer frei */

  var cv = document.getElementById('feld');
  var gl = cv.getContext('webgl2', { alpha:false, antialias:false, premultipliedAlpha:false, preserveDrawingBuffer:false })
        || cv.getContext('webgl',  { alpha:false, antialias:false, premultipliedAlpha:false, preserveDrawingBuffer:false });
  if (!gl) { document.getElementById('hinweis').textContent = 'WebGL fehlt'; return; }

  /* ---------------------------------------------------------------- Shader */
  var vsFaden =
    'attribute vec2 aPos;' +
    'attribute vec4 aPar;' +
    'attribute float aGr;' +
    'attribute float aHl;' +            /* x = Helligkeit, y = Hitze */
    'uniform vec2 uRes;' +
    'uniform float uPunkt;' +
    'varying float vA; varying float vH; varying float vAuf; varying float vTon;' +
    'varying float vGr; varying float vHl;' +
    'void main(){' +
    '  vec2 n = (aPos / uRes) * 2.0 - 1.0;' +
    '  gl_Position = vec4(n.x, -n.y, 0.0, 1.0);' +
    '  gl_PointSize = uPunkt * (1.0 + aGr * 0.9);' +
    '  vA = aPar.x; vH = aPar.y; vAuf = aPar.z; vTon = aPar.w; vGr = aGr; vHl = aHl;' +
    '}';

  var fsFaden =
    'precision mediump float;' +
    'varying float vA; varying float vH; varying float vAuf; varying float vTon;' +
    'varying float vGr; varying float vHl;' +
    'uniform float uStaerke; uniform float uPunktModus; uniform float uHitzeTor;' +
    'uniform float uFarbwahl; uniform float uKurve;' +
    'void main(){' +
    /* Die Farbe ist die Identität. In Resonanz wählte vTon zwischen zwei
       Familien; hier läuft es um den ganzen Kreis, damit zehn Agenten
       unterscheidbar bleiben. Die Hitze bleibt, was sie war: Sie entscheidet
       über Sättigung und Helligkeit, nicht über den Ton. Ein kalter Faden ist
       fast grau — die Farbe eines Agenten wird erst sichtbar, wo er wirkt. */
    '  float h = fract(vTon);' +
    '  vec3 rad = clamp(abs(fract(h + vec3(0.0, 0.6667, 0.3333)) * 6.0 - 3.0) - 1.0, 0.0, 1.0);' +
    '  rad = rad * rad * (3.0 - 2.0 * rad);' +
    '  float glut = clamp(vH * 0.80 + (vHl - 0.45) * 0.55, 0.0, 1.0);' +
    '  float satt = 0.30 + 0.70 * clamp(glut * 1.5, 0.0, 1.0);' +
    '  vec3 c = mix(vec3(0.62, 0.66, 0.76), rad, satt);' +
    '  c *= 0.30 + 1.25 * glut;' +
    '  c = mix(c, vec3(1.0, 0.97, 0.90), clamp((glut - 0.62) * 1.7, 0.0, 1.0));' +
    /* Korn war unbedingt weiß — Faktor 1,0, an nichts gebunden. Für Funken
       ist das richtig: Sie sind weißglühend. Aber damit kann kein Korn je
       eine Farbe haben, und ein goldener Ball aus Korn ist unmöglich.
       Jetzt hängt das Weiß an der HITZE statt an der Art: Weißglühend wird,
       was weißglühend ist. Funken liegen bei Hitze 0,9 und kommen damit auf
       94 % Weiß — praktisch unverändert. Darunter bleibt die Farbe. */
    '  c = mix(c, vec3(1.0, 0.98, 0.95),' +
    '          step(0.001, vGr) * smoothstep(0.55, 0.95, vH));' +
    '  float a = vA * uStaerke * mix(1.0, vH * vAuf, uHitzeTor);' +
    '  if (uPunktModus > 0.5) {' +
    '    float d = length(gl_PointCoord - vec2(0.5));' +
    '    if (vGr > 0.001) { a *= smoothstep(0.34, 0.0, d) * (0.9 + vGr * 1.6); }' +
    '    else { a *= smoothstep(0.5, 0.0, d) * 0.55; }' +
    '  }' +
    '  gl_FragColor = vec4(c * a, a);' +
    '}';

  var vsQuad =
    'attribute vec2 aXY; varying vec2 vUV;' +
    'void main(){ vUV = aXY * 0.5 + 0.5; gl_Position = vec4(aXY, 0.0, 1.0); }';
  var fsQuad =
    'precision mediump float; varying vec2 vUV; uniform sampler2D uTex;' +
    'void main(){ gl_FragColor = texture2D(uTex, vUV); }';

  /* Was liegen bleibt, soll nicht alles liegen bleiben. Schwaches verblasst,
     Starkes steht. Die Grenze läuft über die Helligkeit: Ein Schmier von 0,04
     ist in Sekunden fort, ein Wirbelarm von 0,30 bleibt. Damit räumt sich das
     Bild selbst auf, ohne dass das Werk verschwindet. */
  var fsBlass =
    'precision mediump float; varying vec2 vUV; uniform sampler2D uTex;' +
    'uniform float uSchwach, uStark, uAbzug, uMindest;' +
    'void main(){' +
    '  vec4 c = texture2D(uTex, vUV);' +
    '  float L = max(max(c.r, c.g), c.b);' +
    '  float g = smoothstep(0.04, 0.30, L);' +      /* 0 = schwach, 1 = stark */
    '  float f = mix(uSchwach, uStark, g);' +
    /* Multiplizieren allein kommt bei 8 Bit nie an: Ein Pixel bei 0,4 mal
       0,9962 rundet auf sich selbst zurück. Beim Schwachen räumt ein kleiner
       Abzug auf — und wo auch das Starke vergehen SOLL, muss er überall
       greifen, sonst friert das Bild auf halbem Weg ein und rührt sich nie
       wieder. Steht das Starke auf „für immer", ist uMindest null. */
    '  vec3 o = c.rgb * f - ((1.0 - g) * uAbzug + uMindest);' +
    '  gl_FragColor = vec4(max(o, vec3(0.0)), 1.0);' +
    '}';

  function shader(typ, quelle) {
    var s = gl.createShader(typ); gl.shaderSource(s, quelle); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  function programm(vs, fs) {
    var p = gl.createProgram();
    gl.attachShader(p, shader(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    return p;
  }

  var pFaden = programm(vsFaden, fsFaden), pQuad = programm(vsQuad, fsQuad);
  var lPos = gl.getAttribLocation(pFaden, 'aPos'), lPar = gl.getAttribLocation(pFaden, 'aPar'),
    lGr = gl.getAttribLocation(pFaden, 'aGr'),
    lHl = gl.getAttribLocation(pFaden, 'aHl');
  var uRes = gl.getUniformLocation(pFaden, 'uRes'),
      uPunkt = gl.getUniformLocation(pFaden, 'uPunkt'),
      uStaerke = gl.getUniformLocation(pFaden, 'uStaerke'),
      uPunktModus = gl.getUniformLocation(pFaden, 'uPunktModus'),
      uHitzeTor = gl.getUniformLocation(pFaden, 'uHitzeTor'),
      uFarbwahl = gl.getUniformLocation(pFaden, 'uFarbwahl'),
      uKurve = gl.getUniformLocation(pFaden, 'uKurve');
  var lXY = gl.getAttribLocation(pQuad, 'aXY'), uTex = gl.getUniformLocation(pQuad, 'uTex');
  var pBlass = programm(vsQuad, fsBlass);
  var lXY2 = gl.getAttribLocation(pBlass, 'aXY'), uTex2 = gl.getUniformLocation(pBlass, 'uTex'),
      uSchwach = gl.getUniformLocation(pBlass, 'uSchwach'),
      uStark = gl.getUniformLocation(pBlass, 'uStark'),
      uAbzug = gl.getUniformLocation(pBlass, 'uAbzug'),
      uMindest = gl.getUniformLocation(pBlass, 'uMindest');

  var vboFaden = gl.createBuffer();
  var vboQuad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vboQuad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);

  /* ------------------------------------------------------ Niederschlag-FBO */
  var fbo = null, tex = null, fbo2 = null, tex2 = null, BW = 0, BH = 0;
  function zielBauen(w, h) {
    var t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    var f = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    return { f: f, t: t };
  }
  function fboBauen(w, h, erhalten) {
    var altTex = tex, altFbo = fbo, altTex2 = tex2, altFbo2 = fbo2;
    var a = zielBauen(w, h); fbo = a.f; tex = a.t;
    if (1) { var b2 = zielBauen(w, h); fbo2 = b2.f; tex2 = b2.t; }
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);

    /* Beim Drehen des iPads wird der Puffer neu angelegt. Das Bild soll das
       überleben — es ist das Werk, nicht ein Zwischenstand. */
    if (erhalten && altTex) {
      gl.viewport(0, 0, w, h);
      gl.disable(gl.BLEND);
      gl.useProgram(pQuad);
      gl.bindBuffer(gl.ARRAY_BUFFER, vboQuad);
      gl.enableVertexAttribArray(lXY); gl.vertexAttribPointer(lXY, 2, gl.FLOAT, false, 0, 0);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, altTex);
      gl.uniform1i(uTex, 0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    if (altTex) { gl.deleteTexture(altTex); gl.deleteFramebuffer(altFbo); }
    if (altTex2) { gl.deleteTexture(altTex2); gl.deleteFramebuffer(altFbo2); }
    BW = w; BH = h;
  }

  /* Halbwertszeiten in Sekunden: was schwach ist, was stark ist.
     1e9 heißt: bleibt für immer. */
  var blassAkku = 0, abklingen = 0;
  /* Für die Schicht darüber: Räum die Fläche über so viele Sekunden.
     Der einzige Weg, ein Stück zu beenden und wieder von vorn beginnen zu
     lassen — ohne diesen Hahn bleibt der Niederschlag für immer, und das
     ist im laufenden Betrieb richtig, am Ende aber falsch. */
  window.__abklingen = function (sek) { abklingen = sek; };
  function verblassen(dt) {
    blassAkku += dt;
    if (blassAkku < 0.25) return;            /* höchstens viermal je Sekunde */
    var d = blassAkku; blassAkku = 0;
    puls('verblassen');
    /* Vergeht auch, was das Bild über sich selbst weiß? Ohne diese Zeile
       erinnert sich das Feld immer — und „alles vergeht" wäre in Wahrheit
       „das Sichtbare vergeht, das Feld erinnert sich". Die beiden Versuche
       wären derselbe. */
    if (!1) {
      var vg = Math.pow(0.5, d / (25));
      for (var gq = 0; gq < GX * GY; gq++) {
        dich[gq] *= vg; if (dich[gq] < 0.004) dich[gq] = 0;
        dichG[gq] *= vg; if (dichG[gq] < 0.004) dichG[gq] = 0;
      }
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
    gl.viewport(0, 0, BW, BH);
    gl.disable(gl.BLEND);
    gl.useProgram(pBlass);
    /* Der Ausklang: Für eine begrenzte Zeit vergeht auch das Starke, und
       der Abzug greift überall — sonst friert das Bild auf halbem Weg ein,
       denn Multiplizieren erreicht bei 8 Bit die Null nie. */
    var starkHalb = 1e9, mindest = 0;
    if (abklingen > 0) {
      abklingen -= d;
      starkHalb = 2.4; mindest = Math.min(0.02, d * 2.5 / 255);
    }
    gl.uniform1f(uSchwach, Math.pow(0.5, d / (25)));
    gl.uniform1f(uStark, Math.pow(0.5, d / starkHalb));
    gl.uniform1f(uAbzug, Math.min(0.02, d * 1.5 / 255));
    /* 590 statt einer Million: Im Pult ist der Anschlag „für immer" 600 s.
       Mit der alten Schwelle hätte dort auch das Starke vergehen lassen,
       was für immer bleiben soll. */
    gl.uniform1f(uMindest, mindest);
    gl.bindBuffer(gl.ARRAY_BUFFER, vboQuad);
    gl.enableVertexAttribArray(lXY2); gl.vertexAttribPointer(lXY2, 2, gl.FLOAT, false, 0, 0);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.uniform1i(uTex2, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    var tf = fbo; fbo = fbo2; fbo2 = tf;
    var tt = tex; tex = tex2; tex2 = tt;
  }

  /* ------------------------------------------------------------- Das Medium */
  var px = new Float32Array(N), py = new Float32Array(N),
      qx = new Float32Array(N), qy = new Float32Array(N),
      vx = new Float32Array(N), vy = new Float32Array(N),
      hz = new Float32Array(N), lf = new Float32Array(N), lm = new Float32Array(N),
      tn = new Float32Array(N), fest = new Uint8Array(N), korn = new Float32Array(N),
      /* Woher ein Faden kommt: 0 Medium · 1 Strang · 2 Knoten · 3 Korn · 4 Funke.
         Der Niederschlag ist ein Bild, kein Protokoll — wer weiß, wer etwas gemalt
         hat, muss es beim Auftragen wissen, nachher nicht mehr. */
      art = new Uint8Array(N),
      /* Wieviel DIESER Faden hinterlässt. Die Art allein reicht nicht:
         Eine Frage und ein Beschluss sind beide Stränge. */
      abg = new Float32Array(N),
      ABGABE = window.ABGABE || (window.ABGABE = [1, 1, 1, 1, 1]),
      /* wieviel jede Art hinterlässt, 0 = nichts — draußen sichtbar,
         damit das Pult daran greifen kann */
      hl = new Float32Array(N);
  var daten = new Float32Array(N * 16);  /* je (x,y,a,h,auf,ton,größe,tempo) */

  var W = 0, H = 0, dpr = 1;

  function saeen() {
    for (var i = 0; i < N; i++) {
      /* Das Medium schreibt NICHT. In Resonanz tut es das, denn dort ist es
         der Stoff, den die Hand auftraegt. Hier ist es das Feld, in dem die
         Nachrichten fliegen — und wenn es selbst schreibt, schreibt jeder
         Wirbel, der stark genug ist, das Tor aufzustossen. Dann hinterlaesst
         auch eine Nachricht eine Spur, die laut Gesetz keine hinterlassen
         darf. Gemessen: 41 von 255 bei einem Beitrag mit Abgabe null. */
      abg[i] = 0;
      px[i] = qx[i] = rnd() * W;
      py[i] = qy[i] = rnd() * H;
      vx[i] = vy[i] = 0; hz[i] = 0; tn[i] = 0; fest[i] = 0; hl[i] = 0.45;
      lm[i] = 2.6 + rnd() * 3.6; lf[i] = rnd() * lm[i];
      korn[i] = 0; art[i] = 0; abg[i] = 0;
    }
  }

  /* Ein leeres Blatt. Nicht nur der Niederschlag muss weg — auch was das Bild
     über sich selbst weiß (das Dichteraster), was in der Luft liegt (das
     Strömungsfeld) und die Wirbel selbst. Sonst lenkt ein unsichtbarer Rest
     den nächsten Zug, und man hält das für die Einstellung, die man gerade
     verstellt hat. */
  window.__flaecheLeeren = function () {
    var alt = gl.getParameter(gl.FRAMEBUFFER_BINDING);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.viewport(0, 0, BW, BH);
    gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    if (fbo2) { gl.bindFramebuffer(gl.FRAMEBUFFER, fbo2);
                gl.clear(gl.COLOR_BUFFER_BIT); }
    gl.bindFramebuffer(gl.FRAMEBUFFER, alt);
    for (var k = 0; k < GX * GY; k++) { dich[k] = 0; dichG[k] = 0; sfx[k] = 0; sfy[k] = 0; }
    for (var c = 0; c < kerne.length; c++) {
      var K = kerne[c];
      K.s = 0; K.fest = 0; K.om = 0; K.dvx = 0; K.dvy = 0; K.r = 170;
    }
    aktiverKern = null; wach = 0; blassAkku = 0;
    saeen();
  };

  /* ---------------------------------------------------- Das Bild als Feld --
     Was liegt, ist bisher totes Pigment. Hier bekommt es eine Wirkung: ein
     grobes Dichteraster, das beim Auftragen mitgeschrieben wird. Daraus
     folgen zwei Regeln — die Fäden fließen an vorhandenen Strähnen ENTLANG
     statt quer darüber, und wo schon viel liegt, nimmt die Fläche weniger an.
     Damit reagiert das System auf seinen eigenen bisherigen Zustand und nicht
     nur auf die Hand. Das Raster ist grob und in Zellen gedacht; eine
     Größenänderung des Fensters lässt es deshalb unangetastet. */
  var GX = 80, GY = 60;
  var dich = new Float32Array(GX * GY);
  var dichG = new Float32Array(GX * GY);   /* geglättet, dafür stabile Gefälle */

  /* --------------------------------------------------------- Strömungsfeld
     Der gerade Zug hatte bisher nur einen Schub im Umkreis von 150 px um den
     Finger: höchstens ein Viertel des Handtempos, und nur solange der Finger
     dort ist. Wer nicht kreist, bewegte damit fast nichts.
     Das Feld ist die Verallgemeinerung: Die Hand streicht ihre Bewegung in ein
     Raster, das Raster wirkt auf das Medium, und es klingt über etwa anderthalb
     Sekunden ab. Damit wirkt ein Zug nach — und weil das Feld in der Mitte
     schnell und daneben still ist, rollt sich der Rand von selbst ein. */
  var sfx = new Float32Array(GX * GY), sfy = new Float32Array(GX * GY);
  /* Pinselbreite der Hand im Feld und Abklingzeit — als Ausdruck, damit das
     Pult sie im Lauf verstellen kann; in den festen Fassungen sind es
     Konstanten, die der Übersetzer wegrechnet. */

  function feldStreichen(x, y, vx0, vy0, dt) {
    puls('stroemung');
    var FELD_R = 180;
    var ru = FELD_R / W * GX, rv = FELD_R / H * GY;
    var u0 = Math.max(0, Math.floor(x / W * GX - ru)), u1 = Math.min(GX - 1, Math.ceil(x / W * GX + ru));
    var v0 = Math.max(0, Math.floor(y / H * GY - rv)), v1 = Math.min(GY - 1, Math.ceil(y / H * GY + rv));
    var rate = 1 - Math.exp(-9 * dt);
    for (var j = v0; j <= v1; j++) {
      for (var i = u0; i <= u1; i++) {
        var cx = (i + 0.5) / GX * W, cy = (j + 0.5) / GY * H;
        var ex = cx - x, ey = cy - y, d2 = ex*ex + ey*ey;
        if (d2 > FELD_R * FELD_R) continue;
        var g = 1 - Math.sqrt(d2) / FELD_R; g = g * g;
        var k = j * GX + i, w = rate * g;
        sfx[k] += (vx0 - sfx[k]) * w;
        sfy[k] += (vy0 - sfy[k]) * w;
      }
    }
  }

  function feldAbklingen(dt) {
    var f = Math.exp(-dt / (1.5));
    for (var k = 0; k < GX * GY; k++) { sfx[k] *= f; sfy[k] *= f; }
  }
  var glaettZaehler = 0;

  function dichteAbtasten(x, y) {
    var u = x / W * GX - 0.5, v = y / H * GY - 0.5;
    var i = Math.floor(u), j = Math.floor(v);
    if (i < 1 || j < 1 || i >= GX - 2 || j >= GY - 2) return null;
    var fu = u - i, fv = v - j, k = j * GX + i;
    var d00 = dichG[k], d10 = dichG[k+1], d01 = dichG[k+GX], d11 = dichG[k+GX+1];
    var d = (d00*(1-fu) + d10*fu)*(1-fv) + (d01*(1-fu) + d11*fu)*fv;
    if (d < 0.004) return null;
    return { d: d,
             gx: (dichG[k+1] - dichG[k-1]) * 0.5,
             gy: (dichG[k+GX] - dichG[k-GX]) * 0.5 };
  }

  function rasterGlaetten() {
    for (var j = 1; j < GY - 1; j++) {
      for (var i = 1; i < GX - 1; i++) {
        var k = j * GX + i;
        dichG[k] = (dich[k] * 4 + dich[k-1] + dich[k+1] + dich[k-GX] + dich[k+GX]) / 8;
      }
    }
  }

  /* -------------------------------------------------------------- Die Kerne */
  function Kern() { this.x=0; this.y=0; this.om=0; this.s=0; this.r=170; this.fest=0; this.ton=0; this.dvx=0; this.dvy=0; this.hell=0.45; }

  }

  function setzen(x, y, gx, gy, hitze, dauer, welche) {
    var i = spawnZeiger++; if (spawnZeiger >= N) spawnZeiger = 0;
    px[i] = x; py[i] = y; vx[i] = gx; vy[i] = gy;
    hz[i] = hitze; tn[i] = aktiverKern ? aktiverKern.ton : 0.5;
    hl[i] = Math.min(1, Math.sqrt(hvx*hvx + hvy*hvy) / 900);
    fest[i] = 1; korn[i] = 0; lm[i] = dauer; lf[i] = dauer;
    art[i] = welche;
  }

  function filamente(dt) {
    if (!unten) { knotenLadung = 0; linienWert = 0; knotenAktiv = 0; linieHer = 9;
                  letzteHX = hx; letzteHY = hy; return; }

    var tempoH = Math.sqrt(hvx*hvx + hvy*hvy);
    var gerade = 1 - Math.min(1, Math.abs(drehrate) / 1.7);
    var bewegt = Math.min(1, tempoH / 190);
    linienWert = gerade * bewegt;

    linieHer += dt;
    if (linienWert > 0.34) {
      linieHer = 0;
      puls('strang');
      var n = Math.round(30 * linienWert);
      for (var k = 0; k < n; k++) {
        var u = k / n;
        var sx = letzteHX + (hx - letzteHX) * u + (rnd() - 0.5) * 3.5;
        var sy = letzteHY + (hy - letzteHY) * u + (rnd() - 0.5) * 3.5;
        setzen(sx, sy, hvx * (0.90 + 0.14 * rnd()), hvy * (0.90 + 0.14 * rnd()),
               0.26 + 0.26 * linienWert, 1.3 + 0.7 * rnd(), 1);   /* Strang */
      }
    }

    /* Verweilen: wirklich anhalten, nicht nur langsamer werden. */
    if (tempoH < 55 && gerade > 0.3 && linieHer < 0.6) knotenLadung += dt;
    else knotenLadung = 0;
    knotenAktiv = knotenLadung > 0.14 ? 1 : 0;
    if (knotenAktiv) {
      puls('knoten');
      for (var m = 0; m < 16; m++) {
        var w = rnd() * 6.2832, rr = 3 + 15 * Math.sqrt(rnd());
        setzen(hx + Math.cos(w) * rr, hy + Math.sin(w) * rr,
               Math.cos(w) * 9, Math.sin(w) * 9, 0.94, 1.6 + 0.8 * rnd(), 2);   /* Knoten */
      }
    }
    letzteHX = hx; letzteHY = hy;
  }

  /* ------------------------------------------------------------- Mechanik */
  var schreibt = 0;

  function kerneRechnen(dt) {
    if (unten && performance.now() - letzteZeit > 80) {
      var ab = Math.exp(-6 * dt); hvx *= ab; hvy *= ab; drehrate *= ab;
      bogen *= Math.exp(-2.2 * dt);
    }
    if (unten) {
      var g = Math.min(1, dt / 0.6);
      m1x += (hx - m1x) * g; m1y += (hy - m1y) * g;
      if (0.6 > 0) {
        var g2 = Math.min(1, dt / 0.6);
        mx += (m1x - mx) * g2; my += (m1y - my) * g2;
      } else { mx = m1x; my = m1y; }

    }
    if (unten && aktiverKern) {
      var K = aktiverKern;
      var omH, treiben, d;
      if (1) {
        /* Der Wirbel sitzt unter dem Finger. Getaktet wird mit dem Kringeln —
           der Drehrate der eigenen Bewegungsrichtung. Damit braucht es keinen
           Mittelpunkt, den man umkreisen muss, und die Farbe ist dort, wo die
           Hand ist. Wer die Kringelbewegung aufgibt, dem versiegt sie. */
        omH = drehrate;
        treiben = Math.sqrt(hvx*hvx + hvy*hvy) > 60;
        d = K.r;
      } else {
        var rx = hx - K.x, ry = hy - K.y;
        d = Math.sqrt(rx*rx + ry*ry);
        treiben = d > 14 && d < 420;
        omH = treiben ? (hvx * (-ry / d) + hvy * (rx / d)) / d : 0;
      }
      if (treiben) {

        /* Übereinstimmung mit dem Takt, den der Wirbel schon hat. Solange
           wenig Energie da ist, nimmt er fast jeden Takt an — der erste
           Kreis setzt das Tempo. Mit wachsender Energie wird er wählerisch. */
        var delta = omH - K.om;
        var breite = STIMMUNG.sigma * (1.0 + 2.6 * Math.exp(-6.0 * K.s));
        var treffer = Math.exp(-(delta * delta) / (2 * breite * breite));

        K.om += (omH - K.om) * Math.min(1, 7.0 * treffer * dt);
        if (K.om > 22) K.om = 22; if (K.om < -22) K.om = -22;

        var antrieb = Math.min(Math.abs(omH), 12) * 0.12 * druck;
        K.s += (STIMMUNG.aufbau * treffer * antrieb
              - STIMMUNG.stoerung * (1 - treffer) * K.s
              - STIMMUNG.zerfall * K.s) * dt;

        /* Der Kern zieht zur Mitte der Bewegung, nicht zur Hand — sonst
           eiert er beim Kreisen mit. Und je mehr Energie er hat, desto
           weniger lässt er sich noch verschieben: ein starker Wirbel steht. */
        if (K.s > K.fest) K.fest = K.s;
        var folge = 9.0;
        var zx = 1 ? hx : mx, zy = 1 ? hy : my;
        K.x += (zx - K.x) * folge * dt;
        K.y += (zy - K.y) * folge * dt;
        if (1) {
          /* Das Tempo der Hand bestimmt, wo auf der Farbskala der Wirbel
             liegt: langsam die tiefen, satten Töne, schnell die hellen.
             Die Helligkeit selbst bleibt der Resonanz vorbehalten — sonst
             kämpfen zwei Bedeutungen um dieselbe Anzeige. */
          var tp = Math.min(1, Math.sqrt(hvx*hvx + hvy*hvy) / 900);
          if (tp > 0.04) puls('tempo');
          K.hell += (tp - K.hell) * 1.6 * dt;
        }
        if (1 && Math.abs(omH) > 0.8) {
          /* Die Drehrichtung ist die zweite Stimme: links und rechts herum
             werden zwei Farbfamilien. Der Wechsel läuft weich, damit ein
             Richtungswechsel mitten im Zug den Ton wandern lässt. */
          K.ton += ((omH > 0 ? 1 : 0) - K.ton) * 1.6 * dt;
          puls('stimmen');
        }
        var rZiel = !1 ? Math.min(0.13 * Math.min(W, H), Math.max(90, d * 1.25))
                  : (1
                      ? Math.max(0.045 * Math.min(W, H),
                          Math.min(0.26 * Math.min(W, H), schleife * 1.15))
                      : 0.13 * Math.min(W, H));
        if (1 && Math.abs(rZiel - K.r) > 1.5) puls('schleife');
        K.r += (rZiel - K.r) * 0.25 * dt * 1.0;
      } else {
        K.s -= STIMMUNG.zerfall * K.s * dt;
      }
      if (K.s > 1) K.s = 1;
    }

    var maxS = 0;
    for (var i = 0; i < kerne.length; i++) {
      var Q = kerne[i];
      if (Q !== aktiverKern || !unten) {
        /* Nachhall: der Wirbel läuft weiter und klingt ab. Er beginnt nie
           von selbst etwas Neues — ohne Anregung geht alles zur Ruhe. */
        var vd2 = 1 ? Math.sqrt(Q.dvx*Q.dvx + Q.dvy*Q.dvy) : 0;
        Q.s -= (STIMMUNG.zerfall * (vd2 > 40 ? 0.85 : 1.25)) * Q.s * dt;
        Q.om *= (1 - 0.16 * dt);
        if (1) {
          Q.x += Q.dvx * dt; Q.y += Q.dvy * dt;
          var br = Math.exp(-0.28 * dt); Q.dvx *= br; Q.dvy *= br;
        }
        if (Q.s < 0.0008) { Q.s = 0; Q.fest = 0; }
      }
      if (Q.s > maxS) maxS = Q.s;
    }
    var zielWach = Math.max(maxS, unten ? 0.8 : 0);
    wach += (zielWach - wach) * (zielWach > wach ? 2.4 : 0.45) * dt;
    if (wachBodenZeit > 0) {
      wachBodenZeit -= dt;
      if (wach < wachBoden) wach = wachBoden;
    }
    if (wach < 0.0015) wach = 0;

    schreibt = (maxS > STIMMUNG.schwelle || (1 && (linienWert > 0.34 || knotenAktiv))) ? 1 : 0;
  }

  function mediumRechnen(dt) {
    var handTempo = unten ? Math.sqrt(hvx*hvx + hvy*hvy) : 0;
    var reib = Math.exp(-0.85 * dt);
    var schub = 0.26;
    var zug = 2.2;   /* wie stark das Wirbelfeld die Fäden mitnimmt */

    for (var i = 0; i < N; i++) {
      lf[i] -= dt;
      if (lf[i] <= 0) {
        if (1 && korn[i] > 1.2 && hz[i] > 0.30 && rnd() < 0.34) funken(i);
        /* Beim Einsammeln die Abgabe mit zuruecksetzen: Der Platz wird
           weitergegeben, und ohne diese Zeile erbte ein Mediumfaden die
           Abgabe der Nachricht, die vorher darauf lag. */
        fest[i] = 0; art[i] = 0; abg[i] = 0;
        if (rnd() < 0.34) {
          var j = (rnd() * N) | 0;
          px[i] = px[j] + (rnd() - 0.5) * 26; py[i] = py[j] + (rnd() - 0.5) * 26;
          vx[i] = vx[j] * 0.8; vy[i] = vy[j] * 0.8; hz[i] = hz[j];
        } else {
          px[i] = rnd() * W; py[i] = rnd() * H;
          vx[i] = 0; vy[i] = 0; hz[i] = 0;
        }
        lm[i] = 2.6 + rnd() * 3.6; lf[i] = lm[i];
        korn[i] = 0;
      }
      var x = px[i], y = py[i];
      var ax = 0, ay = 0, nah = -1;

      for (var c = 0; c < kerne.length; c++) {
        var K = kerne[c];
        if (K.s < 0.01) continue;
        var rx = x - K.x, ry = y - K.y;
        var d2 = rx*rx + ry*ry;
        if (d2 > 640000) continue;             /* 800 px Reichweite */
        var d = Math.sqrt(d2) + 0.001;
        /* Differentielle Rotation: die Winkelgeschwindigkeit fällt nach
           außen ab. Genau daraus wickeln sich die Arme auf — ein starrer
           Wirbel dreht nur, er zeichnet nichts. */
        var om = K.om * K.r * K.r / (d2 + K.r * K.r);
        var vt = om * d * K.s * zug;
        ax += (-ry / d) * vt - (rx / d) * vt * 0.09;   /* Tangential + wenig Sog */
        ay += ( rx / d) * vt - (ry / d) * vt * 0.09;
        if (d < 7 && K.s > 0.05) { nah = c; }
      }

      /* Die Hand schiebt immer, unabhängig von jeder Resonanz. Das ist die
         Rückmeldung, die dem ersten Prüfstück gefehlt hat. */
      if (1) {
        if (!fest[i]) {
          var fu = (x / W * GX) | 0, fv = (y / H * GY) | 0;
          if (fu >= 0 && fv >= 0 && fu < GX && fv < GY) {
            var fk = fv * GX + fu;
            ax += sfx[fk] * 1.1; ay += sfy[fk] * 1.1;
          }
        }
      } else if (unten && !fest[i]) {
        var dx = x - hx, dy = y - hy;
        var dd = dx*dx + dy*dy;
        if (dd < 22500) {
          var f = (1 - dd / 22500) * schub;
          ax += hvx * f; ay += hvy * f;
        }
      }

      if (nah >= 0) {
        /* Im Kern verschluckt: aussen wieder aussetzen. So entsteht ein
           dauernder Strom hinein statt eines leergefegten Lochs. */
        var K2 = kerne[nah];
        var w = rnd() * 6.2832, rr = K2.r * (1.4 + 1.6 * rnd());
        px[i] = K2.x + Math.cos(w) * rr; py[i] = K2.y + Math.sin(w) * rr;
        var vt0 = K2.om * K2.r * 0.55 * K2.s;
        vx[i] = -Math.sin(w) * vt0; vy[i] = Math.cos(w) * vt0; hz[i] = 0;
        lf[i] = lm[i];
        continue;
      }

      if (fest[i]) { ax *= 0.14; ay *= 0.14; }
      var zaeh = 1;
      if (1) {
        var F = dichteAbtasten(x, y);
        if (F) {
          var gl2 = Math.sqrt(F.gx*F.gx + F.gy*F.gy);
          if (gl2 > 1e-5) {
            /* Entlang der Höhenlinie, nicht quer dazu: neue Züge flechten
               sich in vorhandene ein, statt sie zu überfahren. Die Richtung
               folgt dem, was der Faden ohnehin vorhat — sonst kämpfen Bild
               und Wirbel gegeneinander. */
            var tx = -F.gy / gl2, ty = F.gx / gl2;
            if (tx * vx[i] + ty * vy[i] < 0) { tx = -tx; ty = -ty; }
            var st = 520 * Math.min(1, F.d);
            ax += tx * st; ay += ty * st;
          }
          zaeh = Math.exp(-2.5 * Math.min(1, F.d) * dt);   /* dicke Farbe bremst */
        }
      }

      if (1 && korn[i] <= 0 && !fest[i]) {
        /* Ein Faden trifft einen Lichtpunkt. */
        var vs2 = vx[i]*vx[i] + vy[i]*vy[i];
        if (vs2 > 67600) {
          var u3 = (x / W * KX) | 0, v3 = (y / H * KY) | 0;
          if (u3 >= 0 && v3 >= 0 && u3 < KX && v3 < KY) {
            var t3 = kzelle[v3 * KX + u3];
            if (t3 >= 0 && lf[t3] > 0 && korn[t3] > 0.9) {
              puls('stoss'); funken(t3); lf[t3] = 0; korn[t3] = 0; kzelle[v3 * KX + u3] = -1;
            }
          }
        }
      }
      if (korn[i] > 0) {
        ax = 0; ay = 0;                        /* zuletzt, sonst schiebt das Bild */
        if (1 && korn[i] > 0.9 && lm[i] - lf[i] > 0.45) {
          var zer = 0;
          if (unten && handTempo > 130) {
            var hx2 = x - hx, hy2 = y - hy;
            if (hx2*hx2 + hy2*hy2 < 900) zer = 1;
          }
          if (!zer) for (var c2 = 0; c2 < kerne.length; c2++) {
            var W2 = kerne[c2];
            if (W2.s < 0.12) continue;
            var dv2 = W2.dvx*W2.dvx + W2.dvy*W2.dvy;
            if (dv2 < 4900) continue;            /* nur ein geworfener Wirbel */
            var kx2 = x - W2.x, ky2 = y - W2.y, rr2 = W2.r * 0.5;
            if (kx2*kx2 + ky2*ky2 < rr2*rr2) { zer = 1; break; }
          }
          if (zer) { puls('stoss'); funken(i); lf[i] = 0; korn[i] = 0; continue; }
        }
      }
      var nvx = (vx[i] + (ax - vx[i]) * 4.2 * dt) * reib * zaeh;
      var nvy = (vy[i] + (ay - vy[i]) * 4.2 * dt) * reib * zaeh;
      if (korn[i] > 0) { var kb = Math.exp(-7 * dt); nvx *= kb; nvy *= kb; }
      vx[i] = nvx; vy[i] = nvy;

      qx[i] = x; qy[i] = y;
      x += nvx * dt; y += nvy * dt;

      if (korn[i] > 0) {
        if (x < 0 || x > W || y < 0 || y > H) { lf[i] = 0; }
      } else if (0) {
        if (x < 0) { x += W; qx[i] = x; puls('umlauf'); }
        else if (x > W) { x -= W; qx[i] = x; puls('umlauf'); }
        if (y < 0) { y += H; qy[i] = y; puls('umlauf'); }
        else if (y > H) { y -= H; qy[i] = y; puls('umlauf'); }
      } else {
        /* Was hinausfliegt, ist fort. Nicht hart an der Kante — ein Rand von
           18 % lässt den Faden sichtbar davonfliegen statt an einer Wand zu
           verschwinden. Danach kommt er still und kalt irgendwo wieder herein,
           damit das Feld nicht ausdünnt und die Ruhebewegung bleibt. */
        if (x < -W * 0.18 || x > W * 1.18 || y < -H * 0.18 || y > H * 1.18) {
          x = rnd() * W; y = rnd() * H;
          vx[i] = 0; vy[i] = 0; hz[i] = 0;
          qx[i] = x; qy[i] = y;
        }
      }
      px[i] = x; py[i] = y;
    }
  }

  /* ---------------------------------------------------------- Darstellung */
  function puffern() {
    var j = 0;
    for (var i = 0; i < N; i++) {
      /* Hitze: nah an einem starken Kern wird es hell. */
      var h = 0, tonZiel = -1, hellZiel = -1, nahBest = 0;
      if (fest[i]) { h = hz[i]; }
      else
      for (var c = 0; c < kerne.length; c++) {
        var K = kerne[c];
        if (K.s < 0.05) continue;
        var ex = px[i] - K.x, ey = py[i] - K.y;
        var d = Math.sqrt(ex*ex + ey*ey);
        var nah = 1 - Math.min(1, d / (K.r * 1.35));
        var w = K.s * nah * nah;
        if (w > h) { h = w; tonZiel = K.ton; }
        if (nah > nahBest) { nahBest = nah; hellZiel = K.hell; }
      }
      if (!fest[i]) hz[i] += (h - hz[i]) * 0.16;
      if (tonZiel >= 0) tn[i] += (tonZiel - tn[i]) * 0.10;
      if (hellZiel >= 0) hl[i] += (hellZiel - hl[i]) * 0.10;

      var sx = vx[i], sy = vy[i];
      var tempo = Math.sqrt(sx*sx + sy*sy);
      var a = tempo / 380; if (a > 1) a = 1;
      a = a * a * (3 - 2 * a);
      a += hz[i] * 0.85; if (a > 1) a = 1;
      if (korn[i] > 0) {
        var ak = (korn[i] > 1.2 ? 0.86 + 0.14 * hz[i] : 0.24 + 0.72 * hz[i]) * wach;
        if (ak > a) a = ak;
      }
      /* Ein- und Ausblenden, damit nichts aufpoppt. Die Blende war fest
         0,6 s lang — das ist richtig für einen Faden, der mehrere Sekunden
         lebt, und falsch für alles Kurze: Ein Punkt mit 0,30 s Lebensdauer
         steckt die ganze Zeit in BEIDEN Blenden und kommt in seiner
         Lebensmitte auf 0,25 x 0,25, also ein Sechzehntel seiner
         Helligkeit. Mehr Material half dagegen nichts, es wurde nur
         gleichmäßig matt.
         Jetzt ist die Blende ein Drittel der eigenen Lebensdauer, höchstens
         aber 0,6 s. Für alles, was länger als 1,8 s lebt, ändert sich damit
         nichts. */
      var rest = lf[i], alt2 = lm[i] - lf[i];
      var blende = lm[i] < 1.8 ? lm[i] * 0.333 : 0.6;
      if (rest < blende) a *= rest / blende;
      if (alt2 < blende) a *= alt2 / blende;
      var sf = korn[i] > 0 ? 0 : SCHWEIF;
      var tx = px[i] - sx * sf, ty = py[i] - sy * sf;

      /* Wie viel Farbe nimmt die Fläche hier noch an? Wo schon viel liegt,
         wenig — sonst läuft alles zu. Und was aufgetragen wird, wandert ins
         Raster, damit es beim nächsten Zug lenkt. */
      var auf = ABGABE[art[i]] * abg[i];
      if (1 && schreibt) {
        var gu = (px[i] / W * GX) | 0, gv = (py[i] / H * GY) | 0;
        if (gu >= 0 && gv >= 0 && gu < GX && gv < GY) {
          var gk = gv * GX + gu;
          /* Das Aufnahme-Tor gehört zur sichtbaren Schicht: Es verhindert, dass
             das Bild zuläuft. Wo das Sichtbare vergeht, gibt es nichts zu
             schützen — dann verweigerte eine leer aussehende Stelle nur die
             Farbe, und das läse sich als Fehler statt als Geschichte. */
          var bremse = 1 ? Math.min(0.92, dich[gk] * 1.1) : 0;
          if (bremse > 0.12) puls('sog');
          auf *= 1 - bremse;
          if ((i & 7) === 0) {
            dich[gk] += a * hz[i] * auf * 0.115;
            if (dich[gk] > 1.6) dich[gk] = 1.6;
          }
        }
      }

      daten[j++] = tx * dpr; daten[j++] = ty * dpr; daten[j++] = a * 0.20; daten[j++] = hz[i]; daten[j++] = auf; daten[j++] = tn[i]; daten[j++] = korn[i]; daten[j++] = hl[i];
      daten[j++] = px[i] * dpr; daten[j++] = py[i] * dpr; daten[j++] = a;   daten[j++] = hz[i]; daten[j++] = auf; daten[j++] = tn[i]; daten[j++] = korn[i]; daten[j++] = hl[i];
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, vboFaden);
    gl.bufferData(gl.ARRAY_BUFFER, daten, gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(lPos); gl.vertexAttribPointer(lPos, 2, gl.FLOAT, false, 32, 0);
    gl.enableVertexAttribArray(lPar); gl.vertexAttribPointer(lPar, 4, gl.FLOAT, false, 32, 8);
    if (lGr >= 0) { gl.enableVertexAttribArray(lGr); gl.vertexAttribPointer(lGr, 1, gl.FLOAT, false, 32, 24); }
    if (lHl >= 0) { gl.enableVertexAttribArray(lHl); gl.vertexAttribPointer(lHl, 1, gl.FLOAT, false, 32, 28); }
  }

  function faedenZeichnen(staerke, punkt, tor) {
    gl.useProgram(pFaden);
    gl.uniform2f(uRes, BW, BH);
    gl.uniform1f(uStaerke, staerke);
    gl.uniform1f(uPunkt, punkt);
    gl.uniform1f(uPunktModus, punkt > 1.5 ? 1 : 0);
    gl.uniform1f(uHitzeTor, tor || 0);
    gl.uniform1f(uFarbwahl, 0.0);
    gl.uniform1f(uKurve, 1.0);
    gl.drawArrays(punkt > 1.5 ? gl.POINTS : gl.LINES, 0, N * 2);
  }

  function zeichnen() {
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);            /* additiv, Farbe ist vormultipliziert */
    puffern();

    /* 1) Niederschlag: nur solange der Wirbel in Resonanz ist. */
    if (schreibt) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
      gl.viewport(0, 0, BW, BH);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);   /* deckend, nicht addierend */
      faedenZeichnen(0.1400, 1.0, 1);
      faedenZeichnen(0.1400 * 0.5, 5.0, 1);        /* weicher Auftrag daneben */
      gl.blendFunc(gl.ONE, gl.ONE);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    }

    if (1) verblassen(rahmenDt);

    /* 2) Bildschirm: erst das Liegengebliebene, dann das Lebendige. */
    gl.viewport(0, 0, BW, BH);
    gl.disable(gl.BLEND);
    gl.clearColor(0.020, 0.027, 0.047, 1); gl.clear(gl.COLOR_BUFFER_BIT);

  var stueckNr = 0;
  var STUECK = STUECKE[0];

  var nachName = {};
  AGENTEN.forEach(function (a) { nachName[a.name] = a; });

  /* ============================ EIGENE BLÖCKE ============================

     Dieselbe Freiheit wie bei den Agenten, eine Ebene hoeher: Wer zusieht,
     schiebt die Anzeigebloecke dorthin, wo er sie haben will.

     ZWEI ENTSCHEIDUNGEN, BEIDE BENANNT STATT VERSTECKT.

     1. Gespeichert wird als ANTEIL des Fensters, nicht als Bildpunkt. Beim
        Drehen des iPads bleibt die Lage dadurch sinnvoll statt zu
        verrutschen -- dieselbe Ueberlegung wie bei winkel/nah.

     2. Das Band, in dem der Ring steht, MISST erst dann, wenn wirklich ein
        Block verschoben wurde. Vorher gelten die bisherigen Formeln
        unveraendert. Sie sind auf drei Schirmgroessen eingemessen; sie
        durch eine Messung zu ersetzen wuerde das Bild bei JEDEM aendern,
        auch bei dem, der nie etwas anfasst. Wer nichts verschiebt, sieht
        nichts Neues. */
  var BLOCK_SPEICHER = 'agentarium-bloecke-v1';
  /* WELCHE BLOECKE BEWEGLICH SIND, UND WORAN MAN DAS SIEHT.

     `id`   -- der Block, der bewegt wird.
     `wach` -- der Block, an dem man ablesen kann, dass er gerade dran ist;
               beim Kopf ist das ein anderer als der bewegte, weil die
               Vergroesserung am inneren `#agKopf` haengt und nicht an der
               Spalte `#agRechts`, die ihn traegt.
     `wie`  -- der Zustand, der den Griff hervorholt.

     Die Knoepfe sind NICHT dabei. Ein Knopf, der unter dem Finger waechst,
     verschiebt sich dabei -- man drueckt daneben. Sie bleiben, wo sie sind;
     das ist der kleinste Verlust von allen, und "Plaetze zurueck" wohnt dort.
     Das Blatt `#agWas` traegt seinen Griff, solange es offen ist: offen ist
     bei ihm dasselbe wie vergroessert bei den anderen. */
  var BLOECKE = [
    { id: 'agMarke',    wort: 'Name und Helligkeit', wach: 'agMarke',    wie: 'lesen' },
    { id: 'agEcke',     wort: 'Was geschieht',       wach: 'agEcke',     wie: 'zeigen' },
    { id: 'agRechts',   wort: 'Kopf',                wach: 'agKopf',     wie: 'lesen' },
    { id: 'agWas',      wort: 'Blatt am Kopf',       wach: 'agWas',      wie: 'auf' },
    { id: 'agWerkName', wort: 'Werkname',            wach: 'agWerkName', wie: 'lesen' }
  ];

  /* Ist der Block gerade vergroessert, offen, oder liegt der Zeiger darauf?
     `:hover` am Block erreicht die Griffschicht nicht -- sie liegt darueber.
     Also hier fragen und die Klasse selbst setzen. */
  function blockWach(b) {
    var w = document.getElementById(b.wach || b.id);
    if (!w) return false;
    if (b.wie === 'auf') return w.classList.contains('auf');
    if (w.classList.contains('lesen')) return true;
    try { return w.matches(':hover'); } catch (x) { return false; }
  }
  var bloeckeLage = {};          /* id -> {x, y} als Anteil 0..1 */

  function bloeckeLesen() {
    try {
      var r = JSON.parse(localStorage.getItem(BLOCK_SPEICHER) || '{}');
      BLOECKE.forEach(function (b) {
        var q = r[b.id]; if (!q) return;
        var x = Number(q.x), y = Number(q.y);
        /* Grenzen, damit eine beschaedigte Ablage keinen Block aus dem
           Bild wirft. Die Fensterklemmung holt den Rest herein. */
        if (isFinite(x) && isFinite(y) && x >= -0.1 && x <= 1.1 &&
            y >= -0.1 && y <= 1.1) bloeckeLage[b.id] = { x: x, y: y };
      });
    } catch (e) {}
  }
  function bloeckeSchreiben() {
    try {
      var n = 0; for (var k in bloeckeLage) if (bloeckeLage[k]) n++;
      if (n) localStorage.setItem(BLOCK_SPEICHER, JSON.stringify(bloeckeLage));
      else localStorage.removeItem(BLOCK_SPEICHER);
    } catch (e) {}
  }
  function bloeckeEigen() { for (var k in bloeckeLage) if (bloeckeLage[k]) return 1; return 0; }

  /* Die gespeicherte Lage auf die Bloecke legen. right/bottom muessen auf
     auto, sonst zieht die CSS-Verankerung am anderen Ende weiter mit. */
  function bloeckeSetzen() {
    BLOECKE.forEach(function (b) {
      var e = document.getElementById(b.id); if (!e) return;
      var q = bloeckeLage[b.id];
      if (!q) { e.style.left = e.style.top = e.style.right = e.style.bottom = ''; return; }
      e.style.left = Math.round(q.x * W()) + 'px';
      e.style.top  = Math.round(q.y * H()) + 'px';
      e.style.right = 'auto'; e.style.bottom = 'auto';
    });
    /* Ins Fenster holen, erst nachdem die Lage steht -- vorher hat der
       Block an der neuen Stelle noch keine Masse. */
    BLOECKE.forEach(function (b) {
      if (!bloeckeLage[b.id]) return;
      var e = document.getElementById(b.id); if (!e) return;
      var k = e.getBoundingClientRect();
      if (k.left < 2) e.style.left = '2px';
      else if (k.right > W() - 2) e.style.left = Math.max(2, W() - k.width - 2) + 'px';
      if (k.top < 2) e.style.top = '2px';
      else if (k.bottom > H() - 2) e.style.top = Math.max(2, H() - k.height - 2) + 'px';
    });
  }

  /* ============================== EIGENE PLÄTZE ==========================

     Wer hier zusieht, baut sich sein Bild: Namen lassen sich mit dem Finger
     verschieben. Gespeichert wird nur, was ein Agent von sich aus braucht —
     `winkel` und `nah` —, denn `heimat()` rechnet den Ort bei jedem Bild

     ORT UND BEDEUTUNG SIND GETRENNT, und das ist der wichtigere Teil.
     Vorher hing an `nah` zweierlei: wer als „draußen" gezeichnet wird
     (> 1,05) und wessen Wurf ein EINWURF ist (> 1,1). Ein verschobener
     Peter hätte damit still aufgehört einzuwerfen — die Animation hätte
     ihren Sinn geändert, ohne dass es jemand merkt. `aussen` wird deshalb
     EINMAL aus der Werksstellung abgeleitet und vom Ziehen nicht mehr
     angefasst.

     Der Speicher liegt im Gerät und geht nirgends hin. Niemand außer dem
     Betrachter sieht seine Anordnung. */
  var PLATZ = 'agentarium-plaetze-v1';
  AGENTEN.forEach(function (a) {

  function plaetzeLesen() {

      var r = JSON.parse(localStorage.getItem(PLATZ) || '{}');
      AGENTEN.forEach(function (a) {
        var q = r[a.name]; if (!q) return;
        var w = Number(q.w), n = Number(q.n);

        if (isFinite(w) && isFinite(n) && n >= 0.02 && n <= 40) {

          a.nah = n;

        }

  function plaetzeSchreiben() {

    AGENTEN.forEach(function (a) {
      if (a.winkel === a.heim.winkel && a.nah === a.heim.nah) return;
      r[a.name] = { w: +a.winkel.toFixed(2), n: +a.nah.toFixed(4) };
      eigen++;
    });
    try {
      if (eigen) localStorage.setItem(PLATZ, JSON.stringify(r));
      else localStorage.removeItem(PLATZ);

  /* EIN Knopf fuer beides. Zwei Knoepfe -- einer fuer Namen, einer fuer

  /* HEISST ABSICHTLICH NICHT knopfSetzen. Gemessen am 19.10.: Der Blockzug
     rief `knoepfeSetzen()` -- alle Knoepfe, ein Buchstabe daneben -- und der
     Platz-Knopf erfuhr nie, dass ein Block von Hand steht. Kein Fehler in

  function platzKnopfSetzen() {
    var k = document.getElementById('agPlatz');
    if (!k) return;

      return a.winkel !== a.heim.winkel || a.nah !== a.heim.nah;

  /* Wie weit darf `nah` gehen? So weit, dass die entfernteste Ecke des

     `heimat()` benutzt (y nimmt R * 0,92). Hängt von Fenstergröße, Band

  function nahGrenze() {
    var cx = mx(), cy = my(), r = ringR(), g = 0;
    [[0, 0], [W(), 0], [0, H()], [W(), H()]].forEach(function (c) {

    });
